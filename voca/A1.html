<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 말하기 연습</title>
<style>
:root{--ink:#263238;--muted:#6b7780;--blue:#4c83f1;--pale:#f4f7ff;--line:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#fff}
.app{min-height:100vh;display:flex;flex-direction:column;max-width:1200px;margin:auto;padding:18px 24px 22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.progress{height:7px;background:#e8edf5;border-radius:99px;overflow:hidden;margin:14px 0 20px}.progress>div{height:100%;width:0;background:var(--blue);transition:width .2s}
.main{flex:1;display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:18px;align-items:center}
.arrow{border:0;background:transparent;color:#526170;font-size:42px;cursor:pointer;padding:8px 0}.arrow:disabled{opacity:.2;cursor:default}
.card{background:white;border:1px solid var(--line);border-radius:24px;padding:clamp(24px,5vw,64px);box-shadow:0 8px 30px #24334b0b;text-align:center}
.prompt{margin:0 0 18px;font-size:clamp(25px,4vw,42px);font-weight:750;line-height:1.5}
.filled-blank{display:inline-block;color:#16845b;border-bottom:3px solid currentColor;padding:0 5px;margin:0 3px}
.hint{color:var(--muted);font-size:16px;min-height:24px}
.feedback{min-height:54px;margin:12px 0 0;font-size:20px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.feedback.good{color:#16845b}.feedback.try{color:#c17a13}.feedback.error{color:#c13b4a}
.mascot-wrap{display:none;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 8px}.mascot-wrap.show{display:flex}
.mascot{width:clamp(105px,16vw,150px);height:clamp(105px,16vw,150px);object-fit:contain}
.mascot-wrap.happy .mascot{animation:bunnyHop .65s ease-in-out 2}.mascot-wrap.try .mascot{animation:bearWobble .55s ease-in-out 2}
.mascot-caption{font-size:clamp(22px,3vw,30px);font-weight:900;letter-spacing:1px;transform-origin:center;animation:captionPop .75s ease-in-out 2}
.mascot-wrap.happy .mascot-caption{color:#16845b}.mascot-wrap.try .mascot-caption{color:#c17a13}
@keyframes bunnyHop{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(-17px) rotate(-5deg)}65%{transform:translateY(0) rotate(5deg)}}
@keyframes bearWobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
@keyframes captionPop{0%,100%{transform:scale(.82)}50%{transform:scale(1.18)}}
.bottom{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:12px}
.controls{display:grid;grid-template-columns:1fr 76px 1fr;align-items:center;gap:14px;width:100%;max-width:560px}
.side-button{min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:white;color:#425166;font-size:15px;font-weight:700;cursor:pointer}
.side-button:hover{background:var(--pale)}
.mic{width:76px;height:76px;border:0;border-radius:50%;background:var(--blue);color:white;display:grid;place-items:center;cursor:pointer;box-shadow:0 7px 18px #4c83f14a;transition:transform .15s,background .15s}
.mic svg{width:34px;height:34px;fill:currentColor}.mic.listening{background:#e24c66;transform:scale(1.06);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px #e24c6624}}
.status{color:var(--muted);text-align:center;font-size:14px;min-height:21px}.answer{color:#536171;font-size:15px;min-height:20px;text-align:center}
@media(max-width:650px){.app{padding:12px}.main{grid-template-columns:32px minmax(0,1fr) 32px;gap:5px}.arrow{font-size:32px}.card{padding:24px 12px;border-radius:18px}.controls{grid-template-columns:1fr 68px 1fr;gap:6px}.mic{width:68px;height:68px}.side-button{padding:8px 5px;font-size:12px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><span>영어 말하기 연습</span><span id="counter">1 / 25</span></div>
<div class="progress"><div id="progressBar"></div></div>
<main class="main">
<button class="arrow" id="prev" aria-label="이전 문제">‹</button>
<section class="card">
<div class="mascot-wrap" id="mascotWrap" aria-live="polite"><img class="mascot" id="mascot" alt="정답 응원 캐릭터"><div class="mascot-caption" id="mascotCaption"></div></div>
<div class="prompt" id="prompt">나는 사과를 좋아해요.</div><div class="hint" id="meaning"></div><div class="feedback" id="feedback" aria-live="polite"></div>
</section>
<button class="arrow" id="next" aria-label="다음 문제">›</button>
</main>
<div class="bottom">
<div class="controls">
<button class="side-button" id="showAnswer">정답 확인</button>
<button class="mic" id="mic" aria-label="말하기 시작" title="말하기 시작"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-3.07A7 7 0 0 0 19 11h-2Z"/></svg></button>
<button class="side-button" id="listenAnswer">🔊 정답 듣기</button>
</div>
<div class="status" id="status">마이크 버튼을 누르고 영어로 말해 보세요.</div><div class="answer" id="answer"></div>
</div>
</div>
<script>
const questions=[
{type:"meaning",korean:"만나다",answer:"meet"},
{type:"blank",prompt:"five _____ past three",korean:"3시 5분",answer:"minute"},
{type:"meaning",korean:"멜론",answer:"melon"},
{type:"sentence",english:"milk is healthy food",korean:"우유는 건강에 좋은 음식이다.",answer:"milk is healthy food."},
{type:"blank",prompt:"fresh _____",korean:"신선한 우유",answer:"milk"},
{type:"meaning",korean:"미터",answer:"meter"},
{type:"blank",prompt:"middle _____",korean:"중학교",answer:"school"},
{type:"meaning",korean:"중앙, 가운데",answer:"middle"},
{type:"sentence",english:"The model is tall and handsome.",korean:"그 모델은 키가 크고 잘생겼다.",answer:"The model is tall and handsome."},
{type:"blank",prompt:"one _____ dollars",korean:"100만 달러",answer:"million"},
{type:"meaning",korean:"우유",answer:"milk"},
{type:"blank",prompt:"look in a _____",korean:"거울을 보다",answer:"mirror"},
{type:"meaning",korean:"100만",answer:"million"},
{type:"sentence",english:"The snow is one meter deep.",korean:"눈이 1미터나 쌓였다.",answer:"The snow is one meter deep."},
{type:"blank",prompt:"I _____ you.",korean:"나는 네가 그리워.",answer:"miss"},
{type:"meaning",korean:"모형, 모델",answer:"model"},
{type:"blank",prompt:"pocket _____",korean:"용돈",answer:"money"},
{type:"meaning",korean:"원숭이",answer:"monkey"},
{type:"sentence",english:"We often meet",korean:"우리는 종종 만난다.",answer:"We often meet."},
{type:"blank",prompt:"this _____",korean:"이번 달",answer:"month"},
{type:"meaning",korean:"달",answer:"moon"},
{type:"blank",prompt:"good _____",korean:"아침 인사",answer:"morning"},
{type:"meaning",korean:"입",answer:"mouth"},
{type:"sentence",english:"I get up early everyday.",korean:"나는 매일 아침 일찍 일어난다.",answer:"I get up early everyday."},
{type:"blank",prompt:"_____ your mouth",korean:"입을 움직여 보세요",answer:"move"}
];
let index=0,recognition=null,listening=false,finalTranscript="";
const promptEl=document.getElementById("prompt"),meaningEl=document.getElementById("meaning"),feedbackEl=document.getElementById("feedback"),statusEl=document.getElementById("status"),answerEl=document.getElementById("answer"),micEl=document.getElementById("mic");
function normalize(text){return text.toLowerCase().replace(/[.,!?;:'"’]/g,"").replace(/\s+/g," ").trim()}
function escapeHTML(text){return String(text).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function fillBlank(spoken){const q=questions[index];if(q.type!=="blank")return;promptEl.innerHTML=escapeHTML(q.prompt).replace(/_{2,}/,`<span class="filled-blank">${escapeHTML(spoken.trim())}</span>`)}
function renderQuestion(){stopListening();const q=questions[index];if(q.type==="sentence"){promptEl.textContent=q.english;meaningEl.textContent=q.korean}else{promptEl.textContent=q.type==="blank"?q.prompt:q.korean;meaningEl.textContent=q.type==="blank"?`뜻: ${q.korean}`:""}feedbackEl.textContent="";feedbackEl.className="feedback";hideMascot();answerEl.textContent="";statusEl.textContent="마이크 버튼을 누르고 영어로 말해 보세요.";document.getElementById("counter").textContent=`${index+1} / ${questions.length}`;document.getElementById("progressBar").style.width=`${((index+1)/questions.length)*100}%`;document.getElementById("prev").disabled=index===0;document.getElementById("next").disabled=index===questions.length-1}
function stopListening(){if(recognition&&listening){try{recognition.stop()}catch(e){}}listening=false;micEl.classList.remove("listening");micEl.setAttribute("aria-label","말하기 시작")}
function startListening(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){statusEl.textContent="이 브라우저는 음성 인식을 지원하지 않아요. 최신 Chrome에서 열어 주세요.";feedbackEl.textContent="음성 인식을 사용할 수 없어요.";feedbackEl.className="feedback error";return}if(listening){stopListening();return}finalTranscript="";answerEl.textContent="";feedbackEl.textContent="";recognition=new SR();recognition.lang="en-US";recognition.interimResults=true;recognition.maxAlternatives=1;recognition.continuous=false;recognition.onstart=()=>{listening=true;micEl.classList.add("listening");micEl.setAttribute("aria-label","말하기 중지");const q=questions[index];statusEl.textContent=q.type==="blank"?"빈칸에 들어갈 영어 단어를 말해 보세요.":q.type==="sentence"?"영어 문장 전체를 읽어 보세요.":"한국어 뜻에 맞는 영어 단어를 말해 보세요."};recognition.onresult=event=>{let transcript="";for(let i=event.resultIndex;i<event.results.length;i++)transcript+=event.results[i][0].transcript;finalTranscript=transcript.trim();statusEl.textContent=finalTranscript?`인식한 문장: “${finalTranscript}”`:"듣고 있어요…"};recognition.onerror=event=>{let m="음성을 인식하지 못했어요. 다시 시도해 보세요.";if(event.error==="not-allowed"||event.error==="service-not-allowed")m="마이크 권한이 차단됐어요. 사이트 설정에서 마이크를 허용해 주세요.";else if(event.error==="no-speech")m="말소리가 들리지 않았어요. 다시 말해 보세요.";else if(event.error==="network")m="음성 인식 서비스 연결에 실패했어요. 인터넷 연결을 확인해 주세요.";statusEl.textContent=m};recognition.onend=()=>{listening=false;micEl.classList.remove("listening");micEl.setAttribute("aria-label","말하기 시작");if(finalTranscript)checkAnswer(finalTranscript);else if(!statusEl.textContent.includes("권한")&&!statusEl.textContent.includes("연결에 실패"))statusEl.textContent="다시 말하려면 마이크를 눌러 주세요."};try{recognition.start()}catch(e){statusEl.textContent="마이크를 시작하지 못했어요. 잠시 후 다시 시도해 주세요."}}
function levenshtein(a,b){const row=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=row[0];row[0]=i;for(let j=1;j<=b.length;j++){const old=row[j];row[j]=Math.min(row[j]+1,row[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=old}}return row[b.length]}
function similarityPercent(spoken,expected){const said=normalize(spoken),answer=normalize(expected);if(!said||!answer)return 0;if(said===answer)return 100;const charScore=1-levenshtein(said,answer)/Math.max(said.length,answer.length),sw=said.split(" ").filter(Boolean),aw=answer.split(" ").filter(Boolean);let matched=0;const used=new Set();for(const word of sw){let bi=-1,bs=0;aw.forEach((target,i)=>{if(used.has(i))return;const s=1-levenshtein(word,target)/Math.max(word.length,target.length);if(s>bs){bs=s;bi=i}});if(bi>=0&&bs>=(Math.min(word.length,aw[bi].length)<=3?.67:.72)){matched++;used.add(bi)}}const p=matched/Math.max(sw.length,1),r=matched/Math.max(aw.length,1),ws=p+r?2*p*r/(p+r):0;return Math.round(Math.max(charScore,ws)*100)}
function checkAnswer(spoken){const q=questions[index];if(q.type==="blank")fillBlank(spoken);const score=similarityPercent(spoken,q.answer);answerEl.textContent=`인식한 내용: ${spoken} · 일치도 ${score}%`;if(score>=90){showMascot("perfect");feedbackEl.textContent=`Perfect! 아주 잘했어요! (${score}%) 🎉`;feedbackEl.className="feedback good";statusEl.textContent="일치도 90% 이상이에요!";playFeedbackAudio("perfect")}else if(score>=70){showMascot("goodjob");feedbackEl.textContent=`Good job! 잘했어요! (${score}%) 👍`;feedbackEl.className="feedback good";statusEl.textContent="일치도 70% 이상이에요. 조금만 더 연습해 봐요!";playFeedbackAudio("goodjob")}else{showMascot("tryagain");feedbackEl.textContent=`한 번 더 도전해 봐요! (${score}%) 🙂`;feedbackEl.className="feedback try";statusEl.textContent="인식 결과가 정답과 많이 달라요. 음성 인식 오류일 수도 있어요.";playFeedbackAudio("tryagain")}}
function hideMascot(){const w=document.getElementById("mascotWrap");w.className="mascot-wrap";document.getElementById("mascotCaption").textContent="";document.getElementById("mascot").removeAttribute("src")}
function showMascot(level){const wrap=document.getElementById("mascotWrap"),isTry=level==="tryagain",isPerfect=level==="perfect";wrap.className=`mascot-wrap show ${isTry?"try":"happy"}`;const mascot=document.getElementById("mascot");const imageFiles={perfect:"https://snowj205.github.io/effect-file/perfect.png",goodjob:"https://snowj205.github.io/effect-file/goodjob.png",tryagain:"https://snowj205.github.io/effect-file/tryagain.png"};mascot.alt=isPerfect?"퍼펙트 축하 캐릭터":isTry?"다시 도전 응원 캐릭터":"굿잡 응원 캐릭터";mascot.onerror=()=>{statusEl.textContent="캐릭터 이미지를 불러오지 못했어요. GitHub 저장소의 파일 이름과 주소를 확인해 주세요."};mascot.src=imageFiles[level];document.getElementById("mascotCaption").textContent=isPerfect?"PERFECT!":isTry?"TRY AGAIN!":"GOOD JOB!"}
const soundBase="https://snowj205.github.io/effect-file/";let currentFeedbackAudio=null;
function playFeedbackAudio(level){if(currentFeedbackAudio){currentFeedbackAudio.pause();currentFeedbackAudio.currentTime=0}const files={perfect:"perfect.mp3",goodjob:"goodjob.mp3",tryagain:"tryagain.mp3"};const audio=new Audio(soundBase+files[level]);currentFeedbackAudio=audio;audio.onerror=()=>{statusEl.textContent="음향 파일을 재생할 수 없어요. 저장소의 MP3 파일 이름과 위치를 확인해 주세요."};audio.play().catch(()=>{statusEl.textContent="음향 재생이 차단되었어요. 화면을 한 번 누른 뒤 다시 시도해 주세요."})}
function speakAnswer(){if(!("speechSynthesis"in window)){statusEl.textContent="이 브라우저에서는 정답 음성 재생을 지원하지 않아요.";return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(questions[index].answer);u.lang="en-US";u.rate=.85;window.speechSynthesis.speak(u);statusEl.textContent="정답을 영어로 들려드릴게요."}
document.getElementById("prev").addEventListener("click",()=>{if(index>0){playNavigationTone();index--;renderQuestion()}});
document.getElementById("next").addEventListener("click",()=>{if(index<questions.length-1){playNavigationTone();index++;renderQuestion()}});
document.getElementById("showAnswer").addEventListener("click",()=>{const q=questions[index];if(q.type==="blank")fillBlank(q.answer);answerEl.textContent=`정답: ${q.answer}`;playNavigationTone()});
document.getElementById("listenAnswer").addEventListener("click",speakAnswer);
function playNavigationTone(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type="sine";osc.frequency.setValueAtTime(520,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(740,ctx.currentTime+.09);gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.07,ctx.currentTime+.015);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.13);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.14);setTimeout(()=>ctx.close(),250)}catch(e){}}
micEl.addEventListener("click",startListening);renderQuestion();
</script>
</body>
</html>
