<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 말하기 연습</title>

<style>
:root {
  --ink: #263238;
  --muted: #6b7780;
  --blue: #4c83f1;
  --line: #e2e8f0;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ink);
  background: #fff;
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  max-width: 1200px;
  margin: auto;
  padding: 10px 24px 16px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  color: var(--muted);
  font-size: 14px;
}

.progress {
  height: 6px;
  background: #e8edf5;
  border-radius: 99px;
  overflow: hidden;
  margin: 8px 0 4px;
}

.progress > div {
  height: 100%;
  width: 0;
  background: var(--blue);
  transition: width .2s;
}

/* 문제 영역: 세로 공간 축소 */
.main {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr) 52px;
  gap: 12px;
  align-items: center;
  flex: 1 1 auto;
  min-height: 0;
  margin-top: 35px;
  margin-bottom: 0;
}

.arrow {
  border: 0;
  background: transparent;
  color: #526170;
  font-size: 46px;
  cursor: pointer;
  padding: 8px 0;
}

.arrow:disabled {
  opacity: .2;
  cursor: default;
}

/* 문제 상자 제거 */
.card {
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 8px 12px;
  box-shadow: none;
  text-align: center;
  min-width: 0;
}

.prompt {
  margin: 0 0 8px;
  font-size: 85px;
  font-weight: 450;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.filled-blank {
  display: inline-block;
  color: #16845b;
  border-bottom: 3px solid currentColor;
  padding: 0 5px;
  margin: 0 3px;
}

.hint {
  color: var(--muted);
  font-size: 24px;
  min-height: 20px;
}

.feedback {
  min-height: 42px;
  margin: 5px 0 0;
  font-size: 19px;
  font-weight: 700;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.feedback.good {
  color: #16845b;
}

.feedback.try {
  color: #c17a13;
}

.feedback.error {
  color: #c13b4a;
}

/* 정답 캐릭터 */
.mascot-wrap {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 0 auto 4px;
}

.mascot-wrap.show {
  display: flex;
}

.mascot {
  width: clamp(90px, 13vw, 125px);
  height: clamp(90px, 13vw, 125px);
  object-fit: contain;
}

.mascot-wrap.happy .mascot {
  animation: bunnyHop .65s ease-in-out 2;
}

.mascot-wrap.try .mascot {
  animation: bearWobble .55s ease-in-out 2;
}

.mascot-caption {
  font-size: clamp(21px, 3vw, 28px);
  font-weight: 900;
  letter-spacing: 1px;
  transform-origin: center;
  animation: captionPop .75s ease-in-out 2;
}

.mascot-wrap.happy .mascot-caption {
  color: #16845b;
}

.mascot-wrap.try .mascot-caption {
  color: #c17a13;
}

@keyframes bunnyHop {
  0%, 100% {
    transform: translateY(0) rotate(0);
  }

  35% {
    transform: translateY(-17px) rotate(-5deg);
  }

  65% {
    transform: translateY(0) rotate(5deg);
  }
}

@keyframes bearWobble {
  0%, 100% {
    transform: rotate(0);
  }

  25% {
    transform: rotate(-9deg);
  }

  75% {
    transform: rotate(9deg);
  }
}

@keyframes captionPop {
  0%, 100% {
    transform: scale(.82);
  }

  50% {
    transform: scale(1.18);
  }
}

/* 버튼 영역: 문제 아래쪽으로 간격을 좁혀 배치 */
.bottom {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding-top: 0;
  margin-top: 0;
  padding-bottom: 16px;
  flex-shrink: 0;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 84px 1fr;
  align-items: center;
  gap: 16px;
  width: 100%;
  max-width: 700px;
  margin-top: 20px;
}

/* 정답 확인 및 정답 듣기 버튼 확대 */
.side-button {
  min-height: 64px;
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: white;
  color: #425166;
  font-size: 17px;
  font-weight: 750;
  cursor: pointer;
  transition: background .15s, transform .15s;
}

.side-button:hover {
  background: #f4f7ff;
}

.side-button:active {
  transform: scale(.97);
}

/* 아이콘 버튼: 글자와 테두리 없이 이미지 표시 */
.icon-button {
  width: 64px;
  height: 64px;
  min-height: 0;
  justify-self: center;
  display: grid;
  place-items: center;
  padding: 0;
  border: none;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}

.icon-button:hover {
  background: transparent;
}

.icon-button img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* 마이크 버튼: 배경색과 그림자 제거 */
.mic {
  width: 84px;
  height: 84px;
  padding: 0;
  border: none;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  display: grid;
  place-items: center;
  cursor: pointer;
  overflow: visible;
  transition: transform .15s;
  -webkit-tap-highlight-color: transparent;
}

/* 이미지 자체만 표시 */
.mic-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: transparent;
  border: none;
  border-radius: 0;
}

/* 말하는 동안 이미지 확대 효과 */
.mic.listening {
  background: transparent;
  box-shadow: none;
  transform: scale(1.08);
  animation: micPulse 1s ease-in-out infinite;
}

@keyframes micPulse {
  0%, 100% {
    filter: drop-shadow(0 0 0 transparent);
  }

  50% {
    filter: drop-shadow(0 0 8px #e24c6670);
  }
}

.status {
  display: none; /* 마이크 오류 및 안내 메시지 영역 숨김 */
}

.answer {
  color: #536171;
  font-size: 15px;
  min-height: 20px;
  text-align: center;
  overflow-wrap: anywhere;
}

/* 모바일 화면 */
@media (max-width: 650px) {
  .app {
    padding: 8px 10px 12px;
  }

  .progress {
    margin: 6px 0 2px;
  }

  .main {
    grid-template-columns: 30px minmax(0, 1fr) 30px;
    gap: 3px;
  }

  .arrow {
    font-size: 34px;
  }

  .card {
    padding: 6px 3px;
  }

  .prompt {
    font-size: 40px !important;
    line-height: 1.35;
    margin-bottom: 4px;
  }

  .hint {
    font-size: 14px;
  }

  .feedback {
    min-height: 36px;
    font-size: 16px;
    margin-top: 4px;
  }

  .controls {
    grid-template-columns: 1fr 64px 1fr;
    gap: 5px;
    max-width: 100%;
    margin-top: 20px;
  }

  .mic {
    width: 64px;
    height: 64px;
  }

  .side-button {
    min-height: 56px;
    padding: 8px 4px;
    font-size: 13px;
    border-radius: 11px;
  }

  .icon-button {
    width: 44px;
    height: 44px;
    min-height: 0;
    padding: 0;
    border: none;
    border-radius: 0;
  }

  .bottom {
    gap: 3px;
  }

  .status {
    font-size: 12px;
  }

  .answer {
    font-size: 20px !important;
}
  .prompt {
    font-size: 40px !important;
  }
}
</style>
</head>

<body>
<div class="app">

  <div class="top">
    <span>영어 말하기 연습</span>
    <span id="counter">1 / 15</span>
  </div>

  <div class="progress">
    <div id="progressBar"></div>
  </div>

  <main class="main">

    <button class="arrow" id="prev" aria-label="이전 문제">‹</button>

    <section class="card">

      <div class="mascot-wrap" id="mascotWrap" aria-live="polite">
        <img class="mascot" id="mascot" alt="정답 응원 캐릭터">
        <div class="mascot-caption" id="mascotCaption"></div>
      </div>

      <div class="prompt" id="prompt">나는 사과를 좋아해요.</div>
      <div class="hint" id="meaning"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>

    </section>

    <button class="arrow" id="next" aria-label="다음 문제">›</button>

  </main>

  <div class="bottom">

    <div class="controls">

      <button class="side-button icon-button" id="showAnswer" aria-label="정답 확인" title="정답 확인">
        <img id="bulbImage"
             src="https://snowj205.github.io/effect-file/bulb_gy.png"
             alt="정답 확인">
      </button>

      <button
        class="mic"
        id="mic"
        aria-label="말하기 시작"
        title="말하기 시작"
      >
        <img
          class="mic-image"
          id="micImage"
          src="https://snowj205.github.io/effect-file/mic_gy.png"
          alt="마이크"
        >
      </button>

      <button class="side-button icon-button" id="listenAnswer" aria-label="정답 듣기" title="정답 듣기">
        <img id="speakerImage"
             src="https://snowj205.github.io/effect-file/speaker_gy.png"
             alt="정답 듣기">
      </button>

    </div>

    <div class="status" id="status"></div>

    <div class="answer" id="answer"></div>

  </div>

</div>

<script>
const questions = [
  { type: "meaning", korean: "그,저", answer: "the" },
  { type: "meaning", korean: "그때, 그리고나서", answer: "then" },
  { type: "meaning", korean: "그곳에", answer: "there" },
  { type: "meaning", korean: "그들", answer: "they" },
  { type: "meaning", korean: "두꺼운", answer: "thick" },
  { type: "meaning", korean: "얇은,날씬한", answer: "thin" },
  { type: "meaning", korean: "물건,일", answer: "thing" },
  { type: "meaning", korean: "생각하다", answer: "think" },
  { type: "meaning", korean: "목마른", answer: "thirsty" },
  { type: "meaning", korean: "이것", answer: "this" },
  { type: "meaning", korean: "그 소녀는 지갑을 잃어버렸다.", answer: "the girl has lost here wallet." },
  { type: "meaning", korean: "그리고나서 관광객들이 모여들기 시작했어요.", answer: "then came visitors." },
  { type: "meaning", korean: "그는 그곳 근처에 산다.", answer: "He lives near there." },
  { type: "meaning", korean: "그들은 기다렸다.", answer: "They waited." },
  { type: "meaning", korean: "두꺼운 사전", answer: "a thick dictionary" },
  { type: "meaning", korean: "저 남자는 날씬하다.", answer: "That man is thin." },
  { type: "meaning", korean: "많은 것을 사다", answer: "buy many things" },
  { type: "meaning", korean: "신중히 생각하다.", answer: "think carefully" },
  { type: "meaning", korean: "나는 배고픈 데다 목도 마르다.", answer: "I am hungry and thirsty." },
  { type: "meaning", korean: "이것은 먹을 수 있다.", answer: "this is edible." }
];

let index = 0;
let recognition = null;
let listening = false;
let finalTranscript = "";
let finalAlternatives = [];

const promptEl = document.getElementById("prompt");
const meaningEl = document.getElementById("meaning");
const feedbackEl = document.getElementById("feedback");
const statusEl = document.getElementById("status");
const answerEl = document.getElementById("answer");
const micEl = document.getElementById("mic");
const micImageEl = document.getElementById("micImage");
const bulbImageEl = document.getElementById("bulbImage");
const speakerImageEl = document.getElementById("speakerImage");

const bulbIdleImage = "https://snowj205.github.io/effect-file/bulb_gy.png";
const bulbPressedImage = "https://snowj205.github.io/effect-file/bulb_pk.png";
const speakerIdleImage = "https://snowj205.github.io/effect-file/speaker_gy.png";
const speakerPlayingImage = "https://snowj205.github.io/effect-file/speaker_pk.png";

const micIdleImage =
  "https://snowj205.github.io/effect-file/mic_gy.png";

const micSpeakingImage =
  "https://snowj205.github.io/effect-file/mic_pk.png";

/* 마이크 이미지 변경 */
function setMicImage(isSpeaking) {
  micImageEl.src = isSpeaking ? micSpeakingImage : micIdleImage;
}

function normalize(text) {
  return text.toLowerCase()
    .replace(/[.,!?;:'"’]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[ch]));
}

function fillBlank(spoken) {
  const q = questions[index];

  if (q.type !== "blank") return;

  promptEl.innerHTML = escapeHTML(q.prompt).replace(
    /_{2,}/,
    `<span class="filled-blank">${escapeHTML(spoken.trim())}</span>`
  );
}

function renderQuestion() {
  stopListening();

  finalTranscript = "";

  const q = questions[index];

  if (q.type === "sentence") {
    promptEl.textContent = q.english;
    meaningEl.textContent = q.korean;
  } else {
    promptEl.textContent = q.type === "blank" ? q.prompt : q.korean;
    meaningEl.textContent = q.type === "blank" ? `뜻: ${q.korean}` : "";
  }

  feedbackEl.textContent = "";
  feedbackEl.className = "feedback";

  hideMascot();

  answerEl.textContent = "";
  statusEl.textContent = "";
  bulbImageEl.src = bulbIdleImage;
  speakerImageEl.src = speakerIdleImage;

  document.getElementById("counter").textContent =
    `${index + 1} / ${questions.length}`;

  document.getElementById("progressBar").style.width =
    `${((index + 1) / questions.length) * 100}%`;

  document.getElementById("prev").disabled = index === 0;
  document.getElementById("next").disabled =
    index === questions.length - 1;
}

/* 말하기를 중단하고 검정 마이크 이미지로 복귀 */
function stopListening() {
  const wasListening = listening;

  listening = false;

  micEl.classList.remove("listening");
  micEl.setAttribute("aria-label", "말하기 시작");

  setMicImage(false);

  if (recognition && wasListening) {
    try {
      recognition.stop();
    } catch (e) {}
  }
}

/* 음성 인식 시작 */
function startListening() {
  const SR = window.SpeechRecognition ||
             window.webkitSpeechRecognition;

  if (!SR) {
    statusEl.textContent =
      "이 브라우저는 음성 인식을 지원하지 않아요. 최신 Chrome에서 열어 주세요.";

    feedbackEl.textContent = "음성 인식을 사용할 수 없어요.";
    feedbackEl.className = "feedback error";
    return;
  }

  if (listening) {
    stopListening();
    return;
  }

  finalTranscript = "";
  answerEl.textContent = "";
  feedbackEl.textContent = "";

  recognition = new SR();

  recognition.lang = "en-US";
  recognition.interimResults = true;
  recognition.maxAlternatives = 3;
  recognition.continuous = false;

  /* 듣기 시작: 분홍 마이크 이미지 */
  recognition.onstart = () => {
    listening = true;

    micEl.classList.add("listening");
    micEl.setAttribute("aria-label", "말하기 중지");

    setMicImage(true);

    const q = questions[index];

    if (q.type === "blank") {
      statusEl.textContent =
        "";
    } else if (q.type === "sentence") {
      statusEl.textContent =
        "";
    } else {
      statusEl.textContent =
        "";
    }
  };

  recognition.onresult = event => {
  let interim = "";
  const q = questions[index];

  for (let i = event.resultIndex; i < event.results.length; i++) {
    const result = event.results[i];

    if (result.isFinal) {
      const alternatives = [];

      for (let a = 0; a < result.length; a++) {
        const candidate = result[a].transcript.trim();

        if (candidate) alternatives.push(candidate);
      }

      if (alternatives.length) {
        finalAlternatives = alternatives;
        finalTranscript = alternatives[0];
      }
    } else {
      interim += result[0].transcript;
    }
  }

  // 안내 문구는 표시하지 않고, 채점이 끝난 뒤 인식 내용과 일치도를 표시합니다.
  statusEl.textContent = "";
};

  recognition.onerror = event => {
    let message = "음성을 인식하지 못했어요. 다시 시도해 보세요.";

    if (
      event.error === "not-allowed" ||
      event.error === "service-not-allowed"
    ) {
      message =
        "마이크 권한이 차단됐어요. 사이트 설정에서 마이크를 허용해 주세요.";
    } else if (event.error === "no-speech") {
      message = "말소리가 들리지 않았어요. 다시 말해 보세요.";
    } else if (event.error === "network") {
      message =
        "음성 인식 서비스 연결에 실패했어요. 인터넷 연결을 확인해 주세요.";
    }

    statusEl.textContent = message;
  };

  recognition.onend = () => {
  listening = false;

  micEl.classList.remove("listening");
  micEl.setAttribute("aria-label", "말하기 시작");

  // 듣기 종료: 검정 마이크 이미지
  setMicImage(false);

  if (finalAlternatives.length || finalTranscript) {
    const q = questions[index];

    const candidates = [
      ...new Set(
        finalAlternatives.length
          ? finalAlternatives
          : [finalTranscript]
      )
    ];

    candidates.sort(
      (a, b) =>
        similarityPercent(b, q.answer) -
        similarityPercent(a, q.answer)
    );

    const transcriptToCheck = candidates[0];

    finalTranscript = "";
    finalAlternatives = [];

    checkAnswer(transcriptToCheck);

  } else if (
    !statusEl.textContent.includes("권한") &&
    !statusEl.textContent.includes("연결에 실패")
  ) {
    statusEl.textContent = "";
  }
};

  try {
    recognition.start();
  } catch (e) {
    listening = false;

    micEl.classList.remove("listening");
    micEl.setAttribute("aria-label", "말하기 시작");

    setMicImage(false);

    statusEl.textContent =
      "마이크를 시작하지 못했어요. 잠시 후 다시 시도해 주세요.";
  }
}

/* 문자열 차이 계산 */
function levenshtein(a, b) {
  const row = Array.from(
    {length: b.length + 1},
    (_, i) => i
  );

  for (let i = 1; i <= a.length; i++) {
    let prev = row[0];
    row[0] = i;

    for (let j = 1; j <= b.length; j++) {
      const old = row[j];

      row[j] = Math.min(
        row[j] + 1,
        row[j - 1] + 1,
        prev + (a[i - 1] === b[j - 1] ? 0 : 1)
      );

      prev = old;
    }
  }

  return row[b.length];
}

/* 정답과 음성 인식 결과 비교 */
function similarityPercent(spoken, expected) {
  // 음성 인식 결과와 정답을 문자열로 변환
  const said = normalize(String(spoken ?? ""));
  const answer = normalize(String(expected ?? ""));

  if (!said || !answer) return 0;
  if (said === answer) return 100;

  const sw = said.split(" ").filter(Boolean);
  const aw = answer.split(" ").filter(Boolean);

  const rows = Array.from(
    { length: sw.length + 1 },
    (_, i) => i
  );

  for (let i = 1; i <= sw.length; i++) {
    let previous = rows[0];
    rows[0] = i;

    for (let j = 1; j <= aw.length; j++) {
      const old = rows[j];

      rows[j] = Math.min(
        rows[j] + 1,
        rows[j - 1] + 1,
        previous + (sw[i - 1] === aw[j - 1] ? 0 : 1)
      );

      previous = old;
    }
  }

  const wordScore =
    1 - rows[aw.length] / Math.max(sw.length, aw.length, 1);

  const charScore =
    1 - levenshtein(said, answer) /
    Math.max(said.length, answer.length, 1);

  return Math.round(
    Math.max(
      0,
      Math.min(1, wordScore * 0.75 + charScore * 0.25)
    ) * 100
  );
}

/* 채점 결과 */
function checkAnswer(spoken) {
  const q = questions[index];

  if (q.type === "blank") {
    fillBlank(spoken);
  }

  const score = Number(similarityPercent(spoken, q.answer));
  const safeScore = Number.isFinite(score) ? score : 0;

  answerEl.textContent =
    `인식한 내용: ${spoken} · 일치도 ${safeScore}%`;

  statusEl.textContent = "";

  if (safeScore >= 85) {

    // 한글 뜻 문제를 맞히면 영어 정답을 문제 화면에 표시
    if (q.type === "meaning") {
        promptEl.textContent = q.answer;
        meaningEl.textContent = q.korean;
    }

    showMascot("perfect");

    feedbackEl.textContent =
      `Perfect! 아주 잘했어요! (${safeScore}%) 🎉`;
    feedbackEl.className = "feedback good";
   statusEl.textContent = "";

    playFeedbackAudio("perfect");

  } else if (safeScore >= 65) {
    showMascot("goodjob");

    // 65점 이상이면 영어 정답과 한글 뜻 표시
    if (q.type === "meaning" || q.type === "sentence") {
        promptEl.textContent = q.answer;
        meaningEl.textContent = q.korean;
    }

    feedbackEl.className = "feedback good";

    statusEl.textContent = "";

    playFeedbackAudio("goodjob");

  } else {
    showMascot("tryagain");

    feedbackEl.textContent =
      `한 번 더 도전해 봐요! (${safeScore}%) 🙂`;

    feedbackEl.className = "feedback try";
    statusEl.textContent = "";

    playFeedbackAudio("tryagain");
  }
}

/* 캐릭터 숨기기 */
function hideMascot() {
  const wrap = document.getElementById("mascotWrap");

  wrap.className = "mascot-wrap";

  document.getElementById("mascotCaption").textContent = "";
  document.getElementById("mascot").removeAttribute("src");
}

/* 캐릭터 표시 */
function showMascot(level) {
  const wrap = document.getElementById("mascotWrap");
  const isTry = level === "tryagain";
  const isPerfect = level === "perfect";

  wrap.className =
    `mascot-wrap show ${isTry ? "try" : "happy"}`;

  const mascot = document.getElementById("mascot");

  const imageFiles = {
    perfect:
      "https://snowj205.github.io/effect-file/perfect.png",
    goodjob:
      "https://snowj205.github.io/effect-file/goodjob.png",
    tryagain:
      "https://snowj205.github.io/effect-file/tryagain.png"
  };

  mascot.alt = isPerfect
    ? "퍼펙트 축하 캐릭터"
    : isTry
      ? "다시 도전 응원 캐릭터"
      : "굿잡 응원 캐릭터";

  mascot.onerror = () => {
    statusEl.textContent =
      "캐릭터 이미지를 불러오지 못했어요. GitHub 저장소의 파일 이름과 주소를 확인해 주세요.";
  };

  mascot.src = imageFiles[level];

  document.getElementById("mascotCaption").textContent = "";
}

/* 채점 효과음 */
const soundBase =
  "https://snowj205.github.io/effect-file/";

let currentFeedbackAudio = null;

function playFeedbackAudio(level) {
  if (currentFeedbackAudio) {
    currentFeedbackAudio.pause();
    currentFeedbackAudio.currentTime = 0;
  }

  const files = {
    perfect: "perfect.mp3",
    goodjob: "goodjob.mp3",
    tryagain: "tryagain.mp3"
  };

  const audio = new Audio(soundBase + files[level]);

  currentFeedbackAudio = audio;

  audio.onerror = () => {
    statusEl.textContent =
      "음향 파일을 재생할 수 없어요. 저장소의 MP3 파일 이름과 위치를 확인해 주세요.";
  };

  audio.play().catch(() => {
    statusEl.textContent =
      "음향 재생이 차단되었어요. 화면을 한 번 누른 뒤 다시 시도해 주세요.";
  });
}

/* 정답 듣기: 재생 중 스피커 아이콘을 분홍색으로 변경 */
function speakAnswer() {
  if (!("speechSynthesis" in window)) {
    statusEl.textContent = "";
    return;
  }

  window.speechSynthesis.cancel();
  speakerImageEl.src = speakerPlayingImage;

  const utterance =
    new SpeechSynthesisUtterance(questions[index].answer);

  utterance.lang = "en-US";
  utterance.rate = 0.85;

  utterance.onend = () => {
    speakerImageEl.src = speakerIdleImage;
  };

  utterance.onerror = () => {
    speakerImageEl.src = speakerIdleImage;
  };

  window.speechSynthesis.speak(utterance);
  statusEl.textContent = "";
}

/* 버튼 이동 효과음 */
function playNavigationTone() {
  try {
    const ctx =
      new (window.AudioContext || window.webkitAudioContext)();

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";

    osc.frequency.setValueAtTime(520, ctx.currentTime);

    osc.frequency.exponentialRampToValueAtTime(
      740,
      ctx.currentTime + 0.09
    );

    gain.gain.setValueAtTime(0.0001, ctx.currentTime);

    gain.gain.exponentialRampToValueAtTime(
      0.07,
      ctx.currentTime + 0.015
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      ctx.currentTime + 0.13
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + 0.14);

    setTimeout(() => ctx.close(), 250);

  } catch (e) {}
}

/* 이전 문제 */
document.getElementById("prev").addEventListener("click", () => {
  if (index > 0) {
    playNavigationTone();
    index--;
    renderQuestion();
  }
});

/* 다음 문제 */
document.getElementById("next").addEventListener("click", () => {
  if (index < questions.length - 1) {
    playNavigationTone();
    index++;
    renderQuestion();
  }
});

/* 정답 확인: 누르면 전구 아이콘을 잠깐 분홍색으로 변경 */
document.getElementById("showAnswer").addEventListener("click", () => {
  const q = questions[index];

  bulbImageEl.src = bulbPressedImage;

  if (q.type === "blank") {
    fillBlank(q.answer);
  }

  answerEl.textContent = `정답: ${q.answer}`;
  statusEl.textContent = "";
  playNavigationTone();

  setTimeout(() => {
    bulbImageEl.src = bulbIdleImage;
  }, 250);
});

/* 정답 듣기 */
document.getElementById("listenAnswer")
  .addEventListener("click", speakAnswer);

/* 마이크 */
micEl.addEventListener("click", startListening);

/* 첫 문제 표시 */
renderQuestion();
</script>
