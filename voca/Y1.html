<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 말하기 연습</title>

<style>
:root {
  --ink: #263238;
  --muted: #6b7780;
  --blue: #4c83f1;
  --line: #e2e8f0;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ink);
  background: #fff;
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  max-width: 1200px;
  margin: auto;
  padding: 10px 24px 16px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  color: var(--muted);
  font-size: 14px;
}

.progress {
  height: 6px;
  background: #e8edf5;
  border-radius: 99px;
  overflow: hidden;
  margin: 8px 0 4px;
}

.progress > div {
  height: 100%;
  width: 0;
  background: #FA85DD;
  transition: width .2s;
}

/* 문제 영역 */
.main {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr) 52px;
  gap: 12px;
  align-items: center;
  flex: 1 1 auto;
  min-height: 0;
  margin-top: 35px;
  margin-bottom: 0;
}

.arrow {
  border: 0;
  background: transparent;
  color: #526170;
  font-size: 46px;
  cursor: pointer;
  padding: 8px 0;
}

.arrow:disabled {
  opacity: .2;
  cursor: default;
}

/* 문제 상자 */
.card {
  background: transparent;
  border: none;
  border-radius: 0;
  padding: 8px 12px;
  box-shadow: none;
  text-align: center;
  min-width: 0;
}

.prompt {
  margin: 0 0 8px;
  font-size: 85px;
  font-weight: 400;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.filled-blank {
  display: inline-block;
  color: #16845b;
  border-bottom: 3px solid currentColor;
  padding: 0 5px;
  margin: 0 3px;
}

.hint {
  color: var(--muted);
  font-size: 24px;
  min-height: 20px;
}

.feedback {
  min-height: 42px;
  margin: 5px 0 0;
  font-size: 19px;
  font-weight: 700;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.feedback.good {
  color: #16845b;
}

.feedback.try {
  color: #c17a13;
}

.feedback.error {
  color: #c13b4a;
}

/* 정답·오답 캐릭터 화면 */
.mascot-wrap {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 99999;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 16px;
  background: rgba(255, 255, 255, 0.96);
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.mascot-wrap.show {
  display: flex;
}

.mascot {
  width: min(70vw, 65vh, 500px);
  height: min(70vw, 65vh, 500px);
  object-fit: contain;
}

.mascot-wrap.happy .mascot {
  animation: bunnyHop 0.65s ease-in-out 2;
}

.mascot-wrap.try .mascot {
  animation: bearWobble 0.55s ease-in-out 2;
}

.mascot-caption {
  font-size: clamp(21px, 3vw, 28px);
  font-weight: 900;
  letter-spacing: 1px;
  transform-origin: center;
  animation: captionPop 0.75s ease-in-out 2;
}

.mascot-wrap.happy .mascot-caption {
  color: #16845b;
}

.mascot-wrap.try .mascot-caption {
  color: #c17a13;
}

@keyframes bunnyHop {
  0%, 100% {
    transform: translateY(0) rotate(0);
  }
  35% {
    transform: translateY(-17px) rotate(-5deg);
  }
  65% {
    transform: translateY(0) rotate(5deg);
  }
}

@keyframes bearWobble {
  0%, 100% {
    transform: rotate(0);
  }
  25% {
    transform: rotate(-9deg);
  }
  75% {
    transform: rotate(9deg);
  }
}

@keyframes captionPop {
  0%, 100% {
    transform: scale(.82);
  }
  50% {
    transform: scale(1.18);
  }
}

/* 하단 버튼 영역 */
.bottom {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding-top: 0;
  margin-top: 0;
  padding-bottom: 16px;
  flex-shrink: 0;
}

/* 버튼 배치: 왼쪽 세로 버튼 + 가운데 마이크 */
.controls {
  display: grid;
  grid-template-columns: 1fr 90px 1fr;
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 900px;
  margin-top: 20px;
}

/* 정답 확인·정답 듣기 왼쪽 세로 배치 */
.left-buttons {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-self: start;
  gap: 12px;
}

/* 오른쪽 빈 공간: 마이크 중앙 정렬용 */
.right-space {
  width: 100%;
}

/* 일반 버튼 */
.side-button {
  min-height: 64px;
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: white;
  color: #425166;
  font-size: 17px;
  font-weight: 750;
  cursor: pointer;
  transition: background .15s, transform .15s;
}

.side-button:hover {
  background: #f4f7ff;
}

.side-button:active {
  transform: scale(.97);
}

/* 아이콘 버튼 */
.icon-button {
  width: 40px;
  height: 40px;
  min-height: 0;
  display: grid;
  place-items: center;
  padding: 0;
  border: none;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}

.icon-button:hover {
  background: transparent;
}

.icon-button img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* 마이크 버튼 */
.mic {
  width: 90px;
  height: 90px;
  padding: 0;
  border: none;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  display: grid;
  place-items: center;
  justify-self: center;
  cursor: pointer;
  overflow: visible;
  transition: transform .15s;
  -webkit-tap-highlight-color: transparent;
}

.mic-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: transparent;
  border: none;
  border-radius: 0;
}

/* 말하는 동안 마이크 확대 */
.mic.listening {
  background: transparent;
  box-shadow: none;
  transform: scale(1.08);
  animation: micPulse 1s ease-in-out infinite;
}

@keyframes micPulse {
  0%, 100% {
    filter: drop-shadow(0 0 0 transparent);
  }
  50% {
    filter: drop-shadow(0 0 8px #e24c6670);
  }
}

.status {
  display: none;
}

.answer {
  color: #536171;
  font-size: 15px;
  min-height: 20px;
  text-align: center;
  overflow-wrap: anywhere;
}



/* 학습 결과 화면(API 없이 계산하는 음성 인식 문장 일치도) */
.results-screen {
  display: none;
  min-height: 100vh;
  padding: 28px 18px 40px;
  background: #fff;
}

.results-screen.show {
  display: block;
}

.results-inner {
  width: min(900px, 100%);
  margin: 0 auto;
}

.results-title {
  margin: 10px 0 8px;
  text-align: center;
  font-size: clamp(28px, 5vw, 42px);
  color: #263238;
}

.results-subtitle {
  margin: 0 auto 26px;
  text-align: center;
  color: #6b7780;
  line-height: 1.6;
}

.results-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}

.result-card {
  padding: 22px 16px;
  border: 1px solid #e2e8f0;
  border-radius: 18px;
  text-align: center;
  background: #fff;
}

.result-number {
  display: block;
  margin-bottom: 7px;
  color: #ed48ad;
  font-size: clamp(30px, 5vw, 42px);
  font-weight: 850;
  overflow-wrap: anywhere;
}

.result-label {
  color: #536171;
  font-size: 15px;
  font-weight: 700;
}

.result-note {
  padding: 15px 17px;
  border-radius: 14px;
  background: #fff4fb;
  color: #68445c;
  font-size: 14px;
  line-height: 1.7;
}

.result-detail-title {
  margin: 28px 0 12px;
  font-size: 21px;
}

.result-list {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.result-list li {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  padding: 12px 14px;
  border: 1px solid #e8edf4;
  border-radius: 12px;
}

.result-question {
  overflow-wrap: anywhere;
  line-height: 1.5;
}

.result-score {
  white-space: nowrap;
  font-weight: 800;
  color: #536171;
}

.result-score.good { color: #16845b; }
.result-score.partial { color: #c17a13; }
.result-score.low { color: #c13b4a; }

.result-actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 28px;
}

.result-action-button {
  min-height: 48px;
  padding: 12px 22px;
  border: 0;
  border-radius: 13px;
  background: #FA85DD;
  color: #fff;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}

.result-action-button.secondary {
  border: 1px solid #e2e8f0;
  background: #fff;
  color: #425166;
}

@media (max-width: 500px) {
  .results-screen { padding: 18px 12px 28px; }
  .results-grid { gap: 9px; }
  .result-card { padding: 17px 9px; }
  .result-label { font-size: 13px; }
  .result-list li { padding: 10px; gap: 8px; }
  .result-question { font-size: 14px; }
  .result-score { font-size: 13px; }
}

/* 모바일 화면 */
@media (max-width: 650px) {
  .app {
    padding: 8px 10px 12px;
  }

  .progress {
    margin: 6px 0 2px;
  }

  .main {
    grid-template-columns: 30px minmax(0, 1fr) 30px;
    gap: 3px;
  }

  .arrow {
    font-size: 34px;
  }

  .card {
    padding: 6px 3px;
  }

  .prompt {
    font-size: 40px !important;
    line-height: 1.35;
    margin-bottom: 4px;
  }

  .hint {
    font-size: 14px;
  }

  .feedback {
    min-height: 36px;
    font-size: 16px;
    margin-top: 4px;
  }

  /* 모바일 버튼 배치 */
  .controls {
    grid-template-columns: 1fr 64px 1fr;
    gap: 5px;
    max-width: 100%;
    margin-top: 20px;
  }

  .left-buttons {
    gap: 8px;
  }

  /* 모바일 전구·스피커 크기 */
  .left-buttons .icon-button {
    width: 40px;
    height: 40px;
  }

  .mic {
    width: 64px;
    height: 64px;
  }

  .side-button {
    min-height: 56px;
    padding: 8px 4px;
    font-size: 13px;
    border-radius: 11px;
  }

  .icon-button {
    min-height: 0;
    padding: 0;
    border: none;
    border-radius: 0;
  }

  .bottom {
    gap: 3px;
  }

  .status {
    font-size: 12px;
  }

  .answer {
    font-size: 20px !important;
  }
}
</style>
</head>

<body>
<div class="app" id="appRoot">

  <div class="top">
    <span>영어 말하기 연습</span>
    <span id="counter">1 / 15</span>
  </div>

  <div class="progress">
    <div id="progressBar"></div>
  </div>

  <main class="main">

    <button class="arrow" id="prev" aria-label="이전 문제">‹</button>

    <section class="card">

      <div class="mascot-wrap" id="mascotWrap" aria-live="polite">
        <img class="mascot" id="mascot" alt="정답 응원 캐릭터">
        <div class="mascot-caption" id="mascotCaption"></div>
      </div>

      <div class="prompt" id="prompt">나는 사과를 좋아해요.</div>
      <div class="hint" id="meaning"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>

    </section>

    <button class="arrow" id="next" aria-label="다음 문제">›</button>

  </main>

  <div class="bottom">

    <div class="controls">

      <!-- 왼쪽: 정답 확인 + 정답 듣기 -->
      <div class="left-buttons">

        <button class="side-button icon-button"
                id="showAnswer"
                aria-label="정답 확인"
                title="정답 확인">
          <img id="bulbImage"
               src="https://snowj205.github.io/effect-file/bulb_gy.png"
               alt="정답 확인">
        </button>

        <button class="side-button icon-button"
                id="listenAnswer"
                aria-label="정답 듣기"
                title="정답 듣기">
          <img id="speakerImage"
               src="https://snowj205.github.io/effect-file/speaker_gy.png"
               alt="정답 듣기">
        </button>

      </div>

      <!-- 가운데: 마이크 -->
      <button
        class="mic"
        id="mic"
        aria-label="말하기 시작"
        title="말하기 시작"
      >
        <img
          class="mic-image"
          id="micImage"
          src="https://snowj205.github.io/effect-file/mic_gy.png"
          alt="마이크"
        >
      </button>

      <!-- 오른쪽 빈 공간 -->
      <div class="right-space"></div>

    </div>

    <div class="status" id="status"></div>

    <div class="answer" id="answer"></div>

  </div>

</div>


<section class="results-screen" id="resultsScreen" aria-labelledby="resultsTitle">
  <div class="results-inner">
    <h1 class="results-title" id="resultsTitle">말하기 연습 결과</h1>
    <p class="results-subtitle" id="resultsSubtitle">수고했어요! 오늘의 연습 결과를 확인해 보세요.</p>

    <div class="results-grid">
      <div class="result-card">
        <span class="result-number" id="resultAverage">—</span>
        <span class="result-label">평균 문장 일치도</span>
      </div>
      <div class="result-card">
        <span class="result-number" id="resultCorrectRate">—</span>
        <span class="result-label">높은 일치도 비율 (85% 이상)</span>
      </div>
      <div class="result-card">
        <span class="result-number" id="resultCorrect">—</span>
        <span class="result-label">높은 일치도 문제 수</span>
      </div>
      <div class="result-card">
        <span class="result-number" id="resultErrorRate">—</span>
        <span class="result-label">문장 불일치율 추정</span>
      </div>
    </div>

    <div class="result-note">
      <strong>점수 안내</strong><br>
      이 결과는 마이크가 인식한 영어 문장과 정답 문장의 일치도를 계산한 것입니다.
      실제 발음의 정확도, 강세, 억양을 전문적으로 평가한 점수는 아니에요.
      말하지 않은 문제는 평균 계산에서 제외됩니다.
    </div>

    <h2 class="result-detail-title">문제별 결과</h2>
    <ul class="result-list" id="resultList"></ul>

    <div class="result-actions">
      <button class="result-action-button" id="retryQuiz">처음부터 다시 연습</button>
      <button class="result-action-button secondary" id="reviewQuiz">문제 다시 보기</button>
    </div>
  </div>
</section>

<script>
const questions = [
  { type: "meaning", korean: "응, 그래(찬성,긍정)", answer: "yeah" },
  { type: "meaning", korean: "해,년", answer: "year" },
  { type: "meaning", korean: "노랑,노란색의", answer: "yellow" },
  { type: "meaning", korean: "예,응(대답)", answer: "yes" },
  { type: "meaning", korean: "어제", answer: "yesterday" },
  { type: "meaning", korean: "아직", answer: "yet" },
  { type: "meaning", korean: "당신,당신들", answer: "you" },
  { type: "meaning", korean: "젋은,어린", answer: "young" },
  { type: "meaning", korean: "0", answer: "zero" },
  { type: "meaning", korean: "동물원", answer: "zoo" },
  { type: "meaning", korean: "그러게요, 안될것 없죠?", answer: "Yeah, why not?" },
  { type: "meaning", korean: "다음 해", answer: "next year" },
  { type: "meaning", korean: "노란 옷을 입은", answer: "wearing yellow" },
  { type: "meaning", korean: '"네"라고 말하다', answer: "say yes" },
  { type: "meaning", korean: "너 좋아 보인다.", answer: "You look good." },
  { type: "meaning", korean: "그저께", answer: "the day before yesterday" },
  { type: "meaning", korean: "그는 아직 살아있다.", answer: "He is yet alive." },
  { type: "meaning", korean: "신부가 너무 어리다.", answer: "The bride is too young." },
  { type: "meaning", korean: "영상의(온도)", answer: "above zero" },
  { type: "meaning", korean: "나는 동물원에서 호랑이를 보았다.", answer: "I saw a tiger in the zoo." }
];

let index = 0;
const questionResults = questions.map(() => null);
let recognition = null;
let listening = false;
let finalTranscript = "";
let finalAlternatives = [];

const promptEl = document.getElementById("prompt");
const meaningEl = document.getElementById("meaning");
const feedbackEl = document.getElementById("feedback");
const statusEl = document.getElementById("status");
const answerEl = document.getElementById("answer");
const micEl = document.getElementById("mic");
const micImageEl = document.getElementById("micImage");
const bulbImageEl = document.getElementById("bulbImage");
const speakerImageEl = document.getElementById("speakerImage");

const bulbIdleImage = "https://snowj205.github.io/effect-file/bulb_gy.png";
const bulbPressedImage = "https://snowj205.github.io/effect-file/bulb_pk.png";
const speakerIdleImage = "https://snowj205.github.io/effect-file/speaker_gy.png";
const speakerPlayingImage = "https://snowj205.github.io/effect-file/speaker_pk.png";

const micIdleImage =
  "https://snowj205.github.io/effect-file/mic_gy.png";

const micSpeakingImage =
  "https://snowj205.github.io/effect-file/mic_pk.png";

/* 마이크 이미지 변경 */
function setMicImage(isSpeaking) {
  micImageEl.src = isSpeaking ? micSpeakingImage : micIdleImage;
}

function normalize(text) {
  return text.toLowerCase()
    .replace(/[.,!?;:'"’]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[ch]));
}

function fillBlank(spoken) {
  const q = questions[index];

  if (q.type !== "blank") return;

  promptEl.innerHTML = escapeHTML(q.prompt).replace(
    /_{2,}/,
    `<span class="filled-blank">${escapeHTML(spoken.trim())}</span>`
  );
}

function renderQuestion() {
  stopListening();

  finalTranscript = "";

  const q = questions[index];

  if (q.type === "sentence") {
    promptEl.textContent = q.english;
    meaningEl.textContent = q.korean;
  } else {
    promptEl.textContent = q.type === "blank" ? q.prompt : q.korean;
    meaningEl.textContent = q.type === "blank" ? `뜻: ${q.korean}` : "";
  }

  feedbackEl.textContent = "";
  feedbackEl.className = "feedback";

  hideMascot();

  answerEl.textContent = "";
  statusEl.textContent = "";
  bulbImageEl.src = bulbIdleImage;
  speakerImageEl.src = speakerIdleImage;

  document.getElementById("counter").textContent =
    `${index + 1} / ${questions.length}`;

  document.getElementById("progressBar").style.width =
    `${((index + 1) / questions.length) * 100}%`;

  document.getElementById("prev").disabled = index === 0;
  document.getElementById("next").disabled = false;
}

/* 말하기를 중단하고 기본 마이크 이미지로 복귀 */
function stopListening() {
  const wasListening = listening;

  listening = false;

  micEl.classList.remove("listening");
  micEl.setAttribute("aria-label", "말하기 시작");

  setMicImage(false);

  if (recognition && wasListening) {
    try {
      recognition.stop();
    } catch (e) {}
  }
}

/* 음성 인식 시작 */
function startListening() {
  const SR = window.SpeechRecognition ||
             window.webkitSpeechRecognition;

  if (!SR) {
    statusEl.textContent =
      "이 브라우저는 음성 인식을 지원하지 않아요. 최신 Chrome에서 열어 주세요.";

    feedbackEl.textContent = "음성 인식을 사용할 수 없어요.";
    feedbackEl.className = "feedback error";
    return;
  }

  if (listening) {
    stopListening();
    return;
  }

  finalTranscript = "";
  finalAlternatives = [];
  answerEl.textContent = "";
  feedbackEl.textContent = "";

  recognition = new SR();

  recognition.lang = "en-US";
  recognition.interimResults = true;
  recognition.maxAlternatives = 3;
  recognition.continuous = false;

  recognition.onstart = () => {
    listening = true;

    micEl.classList.add("listening");
    micEl.setAttribute("aria-label", "말하기 중지");

    setMicImage(true);

    statusEl.textContent = "";
  };

  recognition.onresult = event => {
    let interim = "";

    for (let i = event.resultIndex; i < event.results.length; i++) {
      const result = event.results[i];

      if (result.isFinal) {
        const alternatives = [];

        for (let a = 0; a < result.length; a++) {
          const candidate = result[a].transcript.trim();

          if (candidate) alternatives.push(candidate);
        }

        if (alternatives.length) {
          finalAlternatives = alternatives;
          finalTranscript = alternatives[0];
        }
      } else {
        interim += result[0].transcript;
      }
    }

    statusEl.textContent = "";
  };

  recognition.onerror = event => {
    let message = "음성을 인식하지 못했어요. 다시 시도해 보세요.";

    if (
      event.error === "not-allowed" ||
      event.error === "service-not-allowed"
    ) {
      message =
        "마이크 권한이 차단됐어요. 사이트 설정에서 마이크를 허용해 주세요.";
    } else if (event.error === "no-speech") {
      message = "말소리가 들리지 않았어요. 다시 말해 보세요.";
    } else if (event.error === "network") {
      message =
        "음성 인식 서비스 연결에 실패했어요. 인터넷 연결을 확인해 주세요.";
    }

    statusEl.textContent = message;
  };

  recognition.onend = () => {
    listening = false;

    micEl.classList.remove("listening");
    micEl.setAttribute("aria-label", "말하기 시작");

    setMicImage(false);

    if (finalAlternatives.length || finalTranscript) {
      const q = questions[index];

      const candidates = [
        ...new Set(
          finalAlternatives.length
            ? finalAlternatives
            : [finalTranscript]
        )
      ];

      candidates.sort(
        (a, b) =>
          similarityPercent(b, q.answer) -
          similarityPercent(a, q.answer)
      );

      const transcriptToCheck = candidates[0];

      finalTranscript = "";
      finalAlternatives = [];

      checkAnswer(transcriptToCheck);

    } else if (
      !statusEl.textContent.includes("권한") &&
      !statusEl.textContent.includes("연결에 실패")
    ) {
      statusEl.textContent = "";
    }
  };

  try {
    recognition.start();
  } catch (e) {
    listening = false;

    micEl.classList.remove("listening");
    micEl.setAttribute("aria-label", "말하기 시작");

    setMicImage(false);

    statusEl.textContent =
      "마이크를 시작하지 못했어요. 잠시 후 다시 시도해 주세요.";
  }
}

/* 문자열 차이 계산 */
function levenshtein(a, b) {
  const row = Array.from(
    {length: b.length + 1},
    (_, i) => i
  );

  for (let i = 1; i <= a.length; i++) {
    let prev = row[0];
    row[0] = i;

    for (let j = 1; j <= b.length; j++) {
      const old = row[j];

      row[j] = Math.min(
        row[j] + 1,
        row[j - 1] + 1,
        prev + (a[i - 1] === b[j - 1] ? 0 : 1)
      );

      prev = old;
    }
  }

  return row[b.length];
}

/* 정답과 음성 인식 결과 비교 */
function similarityPercent(spoken, expected) {
  const said = normalize(String(spoken ?? ""));
  const answer = normalize(String(expected ?? ""));

  if (!said || !answer) return 0;
  if (said === answer) return 100;

  const sw = said.split(" ").filter(Boolean);
  const aw = answer.split(" ").filter(Boolean);

  const rows = Array.from(
    { length: sw.length + 1 },
    (_, i) => i
  );

  for (let i = 1; i <= sw.length; i++) {
    let previous = rows[0];
    rows[0] = i;

    for (let j = 1; j <= aw.length; j++) {
      const old = rows[j];

      rows[j] = Math.min(
        rows[j] + 1,
        rows[j - 1] + 1,
        previous + (sw[i - 1] === aw[j - 1] ? 0 : 1)
      );

      previous = old;
    }
  }

  const wordScore =
    1 - rows[aw.length] / Math.max(sw.length, aw.length, 1);

  const charScore =
    1 - levenshtein(said, answer) /
    Math.max(said.length, answer.length, 1);

  return Math.round(
    Math.max(
      0,
      Math.min(1, wordScore * 0.75 + charScore * 0.25)
    ) * 100
  );
}

/* 채점 결과 */
function checkAnswer(spoken) {
  const q = questions[index];

  if (q.type === "blank") {
    fillBlank(spoken);
  }

  const score = Number(similarityPercent(spoken, q.answer));
  const safeScore = Number.isFinite(score) ? score : 0;

  questionResults[index] = { score: safeScore, spoken: String(spoken || "") };

  answerEl.textContent =
    `인식한 내용: ${spoken} · 일치도 ${safeScore}%`;

  statusEl.textContent = "";

  if (safeScore >= 100) {

    if (q.type === "meaning") {
      promptEl.textContent = q.answer;
      meaningEl.textContent = q.korean;
    }

    showMascot("excellent");

    feedbackEl.textContent =
      `Excellent! 정말 훌륭해요! (${safeScore}%) 🎉`;
    feedbackEl.className = "feedback good";

    playFeedbackAudio("excellent");

  } else if (safeScore >= 65) {
    showMascot("good");

    if (q.type === "meaning" || q.type === "sentence") {
      promptEl.textContent = q.answer;
      meaningEl.textContent = q.korean;
    }

    // 굿 캐릭터와 칭찬 문구 표시
    feedbackEl.textContent =
      `Good job! 잘했어요! (${safeScore}%) 👍`;

    feedbackEl.className = "feedback good";

    playFeedbackAudio("good");

  } else {
    showMascot("onemore");

    feedbackEl.textContent =
      `한 번 더 도전 해 봐요! (${safeScore}%) 🙂`;

    feedbackEl.className = "feedback try";

    playFeedbackAudio("onemore");
  }
}

/* 캐릭터 숨기기 */
let mascotTimer = null;

function hideMascot() {
  const wrap = document.getElementById("mascotWrap");

  if (mascotTimer !== null) {
    clearTimeout(mascotTimer);
    mascotTimer = null;
  }

  wrap.className = "mascot-wrap";

  document.getElementById("mascotCaption").textContent = "";
  document.getElementById("mascot").removeAttribute("src");
}

/* 캐릭터 표시 후 2초 뒤 숨기기 */
function showMascot(level) {
  const wrap = document.getElementById("mascotWrap");
  const mascot = document.getElementById("mascot");

  if (mascotTimer !== null) {
    clearTimeout(mascotTimer);
  }

  const imageFiles = {
    excellent: "https://snowj205.github.io/effect-file/excellent.png",
    good: "https://snowj205.github.io/effect-file/good.png",
    onemore: "https://snowj205.github.io/effect-file/onemore.png"
  };

  const isWrong = level === "onemore";

  wrap.className =
    `mascot-wrap show ${isWrong ? "try" : "happy"}`;

  mascot.alt = isWrong
    ? "다시 도전 응원 캐릭터"
    : "정답 축하 캐릭터";

  mascot.onerror = () => {
    hideMascot();
    console.error("캐릭터 이미지를 불러오지 못했습니다.");
  };

  mascot.src = imageFiles[level];

  document.getElementById("mascotCaption").textContent = "";

  mascotTimer = setTimeout(() => {
    hideMascot();
  }, 2000);
}

/* 채점 효과음 */
const soundBase =
  "https://snowj205.github.io/effect-file/";

let currentFeedbackAudio = null;

function playFeedbackAudio(level) {
  if (currentFeedbackAudio) {
    currentFeedbackAudio.pause();
    currentFeedbackAudio.currentTime = 0;
  }

  const files = {
    excellent: "excellent.mp3",
    good: "good.mp3",
    onemore: "onemore.mp3"
  };

  const audio = new Audio(soundBase + files[level]);

  currentFeedbackAudio = audio;

  audio.onerror = () => {
    statusEl.textContent =
      "음향 파일을 재생할 수 없어요. 저장소의 MP3 파일 이름과 위치를 확인해 주세요.";
  };

  audio.play().catch(() => {
    statusEl.textContent =
      "음향 재생이 차단되었어요. 화면을 한 번 누른 뒤 다시 시도해 주세요.";
  });
}

/* 정답 듣기 */
function speakAnswer() {
  if (!("speechSynthesis" in window)) {
    statusEl.textContent = "";
    return;
  }

  window.speechSynthesis.cancel();
  speakerImageEl.src = speakerPlayingImage;

  const utterance =
    new SpeechSynthesisUtterance(questions[index].answer);

  utterance.lang = "en-US";
  utterance.rate = 0.85;

  utterance.onend = () => {
    speakerImageEl.src = speakerIdleImage;
  };

  utterance.onerror = () => {
    speakerImageEl.src = speakerIdleImage;
  };

  window.speechSynthesis.speak(utterance);
  statusEl.textContent = "";
}

/* 버튼 이동 효과음 */
function playNavigationTone() {
  try {
    const ctx =
      new (window.AudioContext || window.webkitAudioContext)();

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "sine";

    osc.frequency.setValueAtTime(520, ctx.currentTime);

    osc.frequency.exponentialRampToValueAtTime(
      740,
      ctx.currentTime + 0.09
    );

    gain.gain.setValueAtTime(0.0001, ctx.currentTime);

    gain.gain.exponentialRampToValueAtTime(
      0.07,
      ctx.currentTime + 0.015
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      ctx.currentTime + 0.13
    );

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + 0.14);

    setTimeout(() => ctx.close(), 250);

  } catch (e) {}
}

/* 이전 문제 */
document.getElementById("prev").addEventListener("click", () => {
  if (index > 0) {
    playNavigationTone();
    index--;
    renderQuestion();
  }
});

/* 다음 문제 버튼 */
document.getElementById("next").onclick = function () {

  // 음성 인식이 진행 중이면 중지
  stopListening();

  // 마지막 문제라면 결과 화면 표시
  if (index >= questions.length - 1) {
    showResults();
    return;
  }

  // 다음 문제로 이동
  playNavigationTone();
  index++;

  renderQuestion();
};

/* 정답 확인 */
document.getElementById("showAnswer").addEventListener("click", () => {
  const q = questions[index];

  bulbImageEl.src = bulbPressedImage;

  if (q.type === "blank") {
    fillBlank(q.answer);
  }

  answerEl.textContent = `정답: ${q.answer}`;
  statusEl.textContent = "";

  playNavigationTone();
});

/* 정답 듣기 */
document.getElementById("listenAnswer")
  .addEventListener("click", speakAnswer);

/* 마이크 */
micEl.addEventListener("click", startListening);

/* 학습 결과 화면 표시 */
function showResults() {
  stopListening();
  hideMascot();

  const completed = questionResults.filter(result => result !== null);
  const scores = completed.map(result => result.score);
  const average = scores.length
    ? Math.round(scores.reduce((sum, score) => sum + score, 0) / scores.length)
    : 0;
  const highScores = scores.filter(score => score >= 85).length;
  const partialScores = scores.filter(score => score >= 65 && score < 85).length;
  const lowScores = scores.filter(score => score < 65).length;
  const highRate = scores.length ? Math.round(highScores / scores.length * 100) : 0;
  const estimatedMismatch = scores.length ? 100 - average : 0;

  document.getElementById("resultSubtitle").textContent =
    `전체 ${questions.length}문제 중 ${completed.length}문제를 말했어요. ` +
    `높은 일치도 ${highScores}문제 · 부분 일치 ${partialScores}문제 · 다시 연습 ${lowScores}문제`;
  document.getElementById("resultAverage").textContent = scores.length ? `${average}%` : "—";
  document.getElementById("resultCorrectRate").textContent = scores.length ? `${highRate}%` : "—";
  document.getElementById("resultCorrect").textContent = `${highScores} / ${questions.length}`;
  document.getElementById("resultErrorRate").textContent = scores.length ? `${estimatedMismatch}%` : "—";

  const resultList = document.getElementById("resultList");
  resultList.innerHTML = "";

  questions.forEach((question, questionIndex) => {
    const result = questionResults[questionIndex];
    const li = document.createElement("li");
    const questionText = document.createElement("span");
    questionText.className = "result-question";
    questionText.textContent = `${questionIndex + 1}. ${question.korean} → ${question.answer}`;

    const scoreText = document.createElement("span");
    scoreText.className = "result-score";

    if (!result) {
      scoreText.textContent = "미응답";
    } else {
      scoreText.textContent = `${result.score}%`;
      scoreText.classList.add(result.score >= 85 ? "good" : result.score >= 65 ? "partial" : "low");
    }

    li.append(questionText, scoreText);
    resultList.appendChild(li);
  });

  const appRoot = document.getElementById("appRoot");
  const resultsScreen = document.getElementById("resultsScreen");

  // CSS 상태와 관계없이 결과 화면이 표시되도록 명시적으로 설정합니다.
  appRoot.style.display = "none";
  resultsScreen.classList.add("show");
  resultsScreen.style.display = "block";
  resultsScreen.style.visibility = "visible";
  resultsScreen.style.opacity = "1";
  window.scrollTo(0, 0);
}

/* 결과 화면에서 다시 연습 */
document.getElementById("retryQuiz").addEventListener("click", () => {
  questionResults.fill(null);
  index = 0;
  document.getElementById("resultsScreen").classList.remove("show");
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("appRoot").style.display = "flex";
  renderQuestion();
  window.scrollTo(0, 0);
});

/* 결과 화면을 닫고 마지막 문제로 돌아가기 */
document.getElementById("reviewQuiz").addEventListener("click", () => {
  document.getElementById("resultsScreen").classList.remove("show");
  document.getElementById("resultsScreen").style.display = "none";
  document.getElementById("appRoot").style.display = "flex";
  index = questions.length - 1;
  renderQuestion();
  window.scrollTo(0, 0);
});

/* 첫 문제 표시 */
renderQuestion();
</script>
