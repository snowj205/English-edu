<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>영어 대화 말하기 연습</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 13px;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: #f5f7fb;
      color: #263238;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 0;
      border-radius: 11px;
      padding: 12px 18px;
      font-weight: bold;
      background: #e9eef5;
      color: #263238;
    }

    button:disabled {
      opacity: 1;
      cursor: not-allowed;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .panel {
      background: #fff;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px #0000000d;
    }

    .top-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .primary {
      background: #3978ed;
      color: white;
    }

    .success {
      background: #e1f5e8;
      color: #187345;
    }

    .warning {
      background: #fff0d6;
      color: #8a5700;
    }

    .chat-panel {
      padding: 22px;
    }

    .progress {
      text-align: center;
      color: #667788;
      font-weight: bold;
      margin-bottom: 18px;
    }

    #chatHistory {
      max-height: 65vh;
      min-height: 250px;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      padding: 10px;
      scroll-behavior: smooth;
    }

    .chat-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .chat-row.right {
      justify-content: flex-end;
    }

    .avatar {
      width: 80px;
      height: 80px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 0;
      border-radius: 0;
      overflow: visible;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .bubble-wrap {
      max-width: 78%;
      min-width: 0;
    }

    .bubble {
      padding: 17px 19px;
      border-radius: 17px;
      font-size: 22px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .translation {
      margin-top: 7px;
      padding: 0 4px;
      color: #667788;
      font-size: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .answer-line {
      margin-bottom: 8px;
      font-weight: bold;
      color: #2459bd;
      font-size: 20px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .left .bubble {
      background: #eaf0ff;
      border-top-left-radius: 4px;
    }

    .right .bubble {
      background: #fff0d9;
      border-top-right-radius: 4px;
    }

    .hidden {
      display: none !important;
    }

    .bubble-hint {
      font-size: 15px;
      color: #7b8794;
      padding: 15px;
      background: #f3f5f8;
      border-radius: 12px;
    }

    .chat-actions {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .chat-actions button {
      padding: 9px 12px;
      font-size: 14px;
    }

    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    .mic-button {
      margin: 0 auto;
      width: 90px;
      height: 90px;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      padding: 0;
    }

    .mic-button img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .mic-button.recording {
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      50% {
        transform: scale(1.04);
      }
    }

    .mic-area {
      text-align: center;
      margin-top: 8px;
    }

    .mic-caption {
      margin-top: 5px;
      color: #526171;
      font-weight: bold;
    }

    .feedback {
      min-height: 32px;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      margin-top: 8px;
      overflow-wrap: anywhere;
    }

    .recognized {
      margin-top: 5px;
      text-align: center;
      color: #536273;
      overflow-wrap: anywhere;
    }

    @media (max-width: 600px) {
      body {
        padding: 9px;
      }

      .panel {
        padding: 13px;
      }

      .chat-panel {
        padding: 14px 10px;
      }

      #chatHistory {
        max-height: 60vh;
        min-height: 220px;
        padding: 6px;
      }

      .bubble {
        font-size: 19px;
        padding: 13px;
      }

      .bubble-wrap {
        max-width: 82%;
      }

      .avatar {
        width: 54px;
        height: 54px;
      }

      .mic-button {
        width: 85px;
        height: 85px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- 상단에는 연습 시작과 역할 바꾸기만 표시 -->
    <section class="panel">
      <div class="top-controls">
        <button class="primary" id="startBtn">연습 시작</button>
        <button id="roleToggleBtn">🔄 역할 바꾸기: 기본</button>
      </div>
    </section>

    <section class="panel chat-panel">

      <div class="progress" id="progress">
        연습 시작 버튼을 눌러 주세요.
      </div>

      <div id="chatHistory">
        <div class="bubble-hint" id="initialHint">
          연습을 시작하면 대화가 아래로 계속 쌓입니다.
          이전 대화는 스크롤해서 다시 볼 수 있어요.
        </div>
      </div>

      <div class="mic-area">
        <button class="mic-button" id="micBtn" aria-label="영어로 말하기" disabled>
          <img
            id="micImage"
            src="https://snowj205.github.io/effect-file/mic_gy.png"
            alt="마이크"
          >
        </button>

        <div class="mic-caption" id="micCaption"></div>
      </div>

      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="recognized" id="recognized"></div>

      <div class="controls">
        <button id="replayBtn" disabled>🔊 영어 다시 듣기</button>
        <button id="showAnswerBtn" disabled>정답 확인</button>
        <button class="primary" id="nextBtn" disabled>다음 대화 →</button>
      </div>

    </section>
  </div>

  <script>
    "use strict";

    // 기본 대화 내용
    const defaultDialogues = [
      {
        en: "Wow! It's beautiful.",
        enKo: "와! 아름답다.",
        ko: "응, 아름다운 도시야. 나는 이 도시가 좋아.",
        answer: "Yes. It's a beautiful city. I like this city."
      },
      {
        en: "I'm hungry. I want to eat something.",
        enKo: "나 배고파. 뭐 좀 먹고 싶어.",
        ko: "나도 배고파. 좋아, 우리 뭐 좀 먹으러 가자.",
        answer: "I'm hungry, too. OK. Let's eat something."
      },
      {
        en: "Where shall we go?",
        enKo: "어디로 갈까?",
        ko: "식당으로 가자.",
        answer: "Let's go to the restaurant."
      },
      {
        en: "How are you?",
        enKo: "어떻게 지내?",
        ko: "우리는 좋아. 너희는 어때?",
        answer: "We are fine. How about you?"
      },
      {
        en: "We are fine, too.",
        enKo: "우리도 좋아.",
        ko: "여행은 어땠어?",
        answer: "How was your trip?"
      },
      {
        en: "It was good. I want to eat together.",
        enKo: "좋았어. 함께 먹고 싶어.",
        ko: "좋아, 같이 먹자.",
        answer: "OK. Let's eat together."
      },
      {
        en: "What do you like? Do you like pizza?",
        enKo: "뭐 좋아하니? 피자 좋아해?",
        ko: "응, 난 피자를 좋아해.",
        answer: "Yes, I like pizza."
      },
      {
        en: "I want to eat pasta. Do you like pasta?",
        enKo: "난 파스타를 먹고 싶어. 너는 파스타 좋아해?",
        ko: "아니, 난 파스타를 좋아하지 않아. 난 햄버거를 좋아해.",
        answer: "No, I don't like pasta. I like hamburger."
      },
      {
        en: "Let's eat!",
        enKo: "먹자!",
        ko: "맛있겠다!",
        answer: "It looks delicious!"
      }
    ];

    let dialogues = defaultDialogues.map(item => ({ ...item }));
    let activeDialogues = [];
    let currentIndex = 0;

    let isRecording = false;
    let recognition = null;
    let speechRunId = 0;

    let waitingForAnswer = false;
    let completed = false;
    let reverseRole = false;

    let currentChild = null;
    let currentReply = null;
    let currentTeacher = null;

    let answerTimer = null;

    const $ = id => document.getElementById(id);

    const chatHistory = $("chatHistory");
    const progress = $("progress");

    const micBtn = $("micBtn");
    const micImage = $("micImage");
    const micCaption = $("micCaption");

    const feedback = $("feedback");
    const recognized = $("recognized");

    const replayBtn = $("replayBtn");
    const showAnswerBtn = $("showAnswerBtn");
    const nextBtn = $("nextBtn");

    // 미국식 영어 고정
    const voiceType = "en-US";

    const micDefault =
      "https://snowj205.github.io/effect-file/mic_gy.png";

    const micActive =
      "https://snowj205.github.io/effect-file/mic_pk.png";

    function setMic(active) {
      micImage.src = active ? micActive : micDefault;
    }

    function scrollBottom() {
      chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function stopSpeech() {
      speechRunId++;

      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
    }

    function speak(text, done) {
      stopSpeech();

      const id = speechRunId;

      if (!("speechSynthesis" in window)) {
        if (done) done();
        return;
      }

      const utterance = new SpeechSynthesisUtterance(text);

      utterance.lang = voiceType;
      utterance.rate = 0.85;
      utterance.pitch = 1;

      utterance.onend = () => {
        if (id === speechRunId && done) {
          done();
        }
      };

      utterance.onerror = () => {
        if (id === speechRunId && done) {
          done();
        }
      };

      speechSynthesis.speak(utterance);
    }

    function avatar(kind) {
      const element = document.createElement("div");
      element.className = "avatar";

      const image = document.createElement("img");

      image.src =
        `https://snowj205.github.io/effect-file/${kind}.png`;

      image.alt = kind === "teacher" ? "선생님" : "아이";

      element.appendChild(image);

      return element;
    }

    function teacherRow(text, translation) {
      const row = document.createElement("div");
      row.className = "chat-row left";

      row.appendChild(avatar("teacher"));

      const wrap = document.createElement("div");
      wrap.className = "bubble-wrap";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      const translationElement = document.createElement("div");
      translationElement.className = "translation";
      translationElement.textContent = translation || "";

      wrap.append(bubble, translationElement);
      row.appendChild(wrap);

      return {
        row,
        bubble,
        translation: translationElement
      };
    }

    function childRow(prompt, answer) {
      const row = document.createElement("div");
      row.className = "chat-row right";

      const wrap = document.createElement("div");
      wrap.className = "bubble-wrap";

      const answerLine = document.createElement("div");
      answerLine.className = "answer-line hidden";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = prompt;

      const actions = document.createElement("div");
      actions.className = "chat-actions";

      const audioButton = document.createElement("button");
      audioButton.textContent = "🔊 정답 영어 듣기";

      const revealButton = document.createElement("button");
      revealButton.textContent = "정답 확인";
      revealButton.className = "primary";

      actions.append(audioButton, revealButton);

      wrap.append(answerLine, bubble, actions);
      row.append(wrap, avatar("child"));

      audioButton.addEventListener("click", () => {
        if (!activeDialogues.length) return;

        const item = activeDialogues[currentIndex];

        speak(reverseRole ? item.en : answer);
      });

      revealButton.addEventListener("click", revealAnswer);

      return {
        row,
        answerLine,
        bubble,
        audio: audioButton,
        reveal: revealButton
      };
    }

    function appendRows(item) {
      currentTeacher = teacherRow(item.en, item.enKo);

      currentChild = childRow(
        reverseRole ? item.enKo : item.ko,
        reverseRole ? item.en : item.answer
      );

      currentReply = teacherRow("", "");
      currentReply.row.classList.add("hidden");

      if (reverseRole) {
        currentTeacher.row.classList.add("hidden");

        chatHistory.append(
          currentTeacher.row,
          currentChild.row,
          currentReply.row
        );
      } else {
        currentChild.row.classList.add("hidden");

        chatHistory.append(
          currentTeacher.row,
          currentChild.row,
          currentReply.row
        );
      }

      scrollBottom();
    }

    function renderCurrent() {
      if (!activeDialogues.length) return;

      stopSpeech();
      stopRecording();

      if (answerTimer) {
        clearTimeout(answerTimer);
        answerTimer = null;
      }

      completed = false;
      waitingForAnswer = false;

      const item = activeDialogues[currentIndex];

      feedback.textContent = "";
      feedback.className = "feedback";

      recognized.textContent = "";

      progress.textContent =
        `대화 ${currentIndex + 1} / ${activeDialogues.length}`;

      micCaption.textContent = "";

      micBtn.disabled = true;
      nextBtn.disabled = true;
      replayBtn.disabled = false;
      showAnswerBtn.disabled = true;

      showAnswerBtn.textContent = "정답 확인";

      setMic(false);

      // 기존 대화를 지우지 않고 새 대화를 아래에 추가
appendRows(item);

      if (reverseRole) {
        showPrompt();
      } else {
        speak(item.en, showPrompt);
      }
    }

    function showPrompt() {
      if (!currentChild || completed) return;

      currentChild.row.classList.remove("hidden");

      const hint = $("initialHint");

      if (hint) {
        hint.classList.add("hidden");
      }

      waitingForAnswer = true;

      micBtn.disabled = false;
      showAnswerBtn.disabled = false;

      currentChild.reveal.disabled = false;
      currentChild.reveal.textContent = "정답 확인";

      micCaption.textContent = "";

      scrollBottom();
    }

    // 연습 시작: 기본 대화 9개를 모두 사용
    $("startBtn").addEventListener("click", () => {
      const validDialogues = dialogues.filter(item =>
        item.en.trim() &&
        item.enKo.trim() &&
        item.ko.trim() &&
        item.answer.trim()
      );

      if (!validDialogues.length) {
        alert("대화 내용이 없습니다.");
        return;
      }

      stopSpeech();
      stopRecording();

      if (answerTimer) {
        clearTimeout(answerTimer);
        answerTimer = null;
      }

      activeDialogues = validDialogues;
      currentIndex = 0;

      

      renderCurrent();
    });

    // 역할 바꾸기
    $("roleToggleBtn").addEventListener("click", () => {
      reverseRole = !reverseRole;

      $("roleToggleBtn").textContent = reverseRole
        ? "🔄 역할 바꾸기: 반대"
        : "🔄 역할 바꾸기: 기본";

      feedback.textContent =
        "역할 설정이 바뀌었어요. 연습 시작을 누르면 적용됩니다.";

      feedback.className = "feedback";
    });

    // 음성 인식 생성
    function createRecognition() {
      const SpeechRecognitionAPI =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognitionAPI) return null;

      const recognizer = new SpeechRecognitionAPI();

      recognizer.lang = voiceType;
      recognizer.continuous = false;
      recognizer.interimResults = true;
      recognizer.maxAlternatives = 5;

      recognizer.onstart = () => {
        isRecording = true;

        micBtn.classList.add("recording");
        setMic(true);

        micCaption.textContent = "";
        feedback.textContent = "";
        recognized.textContent = "";
      };

      recognizer.onresult = event => {
        let finalText = "";
        let interimText = "";

        for (
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ) {
          if (event.results[i].isFinal) {
            finalText += event.results[i][0].transcript;
          } else {
            interimText += event.results[i][0].transcript;
          }
        }

        const shownText =
          (finalText + " " + interimText).trim();

        if (shownText) {
          recognized.textContent = "인식한 영어: " + shownText;
        }

        if (finalText.trim()) {
          checkAnswer(finalText.trim());
        }
      };

      recognizer.onerror = event => {
        isRecording = false;

        micBtn.classList.remove("recording");
        setMic(false);

        if (waitingForAnswer && !completed) {
          micBtn.disabled = false;
        }

        micCaption.textContent = "";

        if (
          event.error === "not-allowed" ||
          event.error === "service-not-allowed"
        ) {
          feedback.textContent =
            "마이크 권한을 허용해 주세요. 브라우저 설정도 확인해 보세요.";
        } else if (event.error === "no-speech") {
          feedback.textContent =
            "음성이 들리지 않았어요. 다시 말해 보세요.";
        } else if (event.error === "network") {
          feedback.textContent =
            "음성 인식 연결에 문제가 있어요. 인터넷 연결을 확인해 주세요.";
        } else if (event.error !== "aborted") {
          feedback.textContent =
            "음성을 인식하지 못했어요. 다시 시도해 보세요.";
        }
      };

      recognizer.onend = () => {
        isRecording = false;

        micBtn.classList.remove("recording");
        setMic(false);

        if (waitingForAnswer && !completed) {
          micBtn.disabled = false;
          micCaption.textContent = "";
        }
      };

      return recognizer;
    }

    function stopRecording() {
      if (recognition && isRecording) {
        try {
          recognition.stop();
        } catch (error) {
          // 이미 중지된 경우에는 아무 작업도 하지 않습니다.
        }
      }

      isRecording = false;

      micBtn.classList.remove("recording");
      setMic(false);
    }

    // 마이크 버튼
    micBtn.addEventListener("click", () => {
      if (
        !waitingForAnswer ||
        !activeDialogues.length ||
        completed
      ) {
        return;
      }

      if (isRecording) {
        stopRecording();
        return;
      }

      if (
        !(window.SpeechRecognition ||
          window.webkitSpeechRecognition)
      ) {
        feedback.textContent =
          "이 브라우저는 음성 인식을 지원하지 않습니다. 최신 Chrome에서 열어 보세요.";
        return;
      }

      try {
        recognition = createRecognition();

        if (!recognition) return;

        micBtn.disabled = true;
        recognition.start();
      } catch (error) {
        micBtn.disabled = false;
        setMic(false);
      }
    });

    // 문장부호를 제거한 뒤 영어 답안 비교
    function normalize(text) {
      return text
        .toLowerCase()
        .replace(/[’‘]/g, "'")
        .replace(/[^a-z0-9\s]/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

// 정답 처리
function checkAnswer(text) {
  if (
    !activeDialogues.length ||
    !waitingForAnswer ||
    completed
  ) {
    return;
  }

  const item = activeDialogues[currentIndex];

  const correctAnswer = reverseRole
    ? item.en
    : item.answer;

  // 쉼표, 마침표, 물음표, 느낌표 등을 무시하고 비교
  if (normalize(text) === normalize(correctAnswer)) {
    waitingForAnswer = false;
    completed = true;

    micBtn.disabled = true;
    nextBtn.disabled = false;
    showAnswerBtn.disabled = true;

    if (currentChild && currentChild.reveal) {
      currentChild.reveal.disabled = true;
    }

    feedback.textContent = "🎉 Perfect! 아주 잘했어요!";
    feedback.className = "feedback success";

    micCaption.textContent =
      "정답이에요! 잠시 후 다음 대화로 넘어갑니다.";

    if (reverseRole) {
      currentReply.row.classList.remove("hidden");
      currentReply.bubble.textContent = item.answer;
      currentReply.translation.textContent = item.ko || "";

      speak(item.answer);
      scrollBottom();
    }

    // 정답이면 1.2초 후 다음 대화로 자동 이동
    answerTimer = setTimeout(() => {
      answerTimer = null;

      if (completed) {
        nextBtn.click();
      }
    }, 1200);

  } else {
    // 오답이어도 현재 대화에서 다시 시도할 수 있도록 처리
    waitingForAnswer = true;
    completed = false;

    micBtn.disabled = false;
    nextBtn.disabled = true;

    feedback.textContent =
      "🔄 조금 달라요! 마이크를 누르고 다시 말해 보세요.";

    feedback.className = "feedback warning";
