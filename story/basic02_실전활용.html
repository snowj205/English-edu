```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>영어 말풍선 대화 연습</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #f5f7fb;
  color: #243044;
  font-family: Arial, "Malgun Gothic", sans-serif;
}

.container {
  max-width: 900px;
  margin: auto;
}

h1 {
  font-size: 28px;
  margin-bottom: 10px;
}

.description {
  color: #788397;
  line-height: 1.7;
  margin-bottom: 24px;
}

.panel {
  background: white;
  border: 1px solid #e0e7f2;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 20px;
}

h2 {
  font-size: 20px;
  margin-top: 0;
}

label {
  display: block;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 7px;
}

input,
textarea,
select {
  width: 100%;
  padding: 11px;
  border: 1px solid #dce4f2;
  border-radius: 9px;
  font-family: inherit;
  font-size: 16px;
  color: #243044;
  background: white;
}

textarea {
  min-height: 65px;
  resize: vertical;
}

.settings {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 18px;
}

button {
  border: 1px solid #dce4f2;
  border-radius: 10px;
  padding: 12px 16px;
  background: white;
  color: #243044;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #edf3ff;
  border-color: #5279d8;
}

.primary {
  background: #5279d8;
  color: white;
  border-color: #5279d8;
}

.primary:hover {
  background: #3e65c2;
  color: white;
}

.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 15px;
}

.button-row button {
  flex: 1;
  min-width: 120px;
}

.editor {
  border-top: 1px solid #e8edf4;
  padding-top: 18px;
  margin-top: 18px;
}

.editor-title {
  font-weight: bold;
  margin-bottom: 12px;
}

.editor-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.field {
  min-width: 0;
}

  font-size: 13px;
  line-height: 1.6;
  color: #788397;
  margin-top: 10px;
}

#chatArea {
  background: #f5f7fb;
  border-radius: 15px;
  border: 1px solid #e0e7f2;

.chat-row {
  display: flex;
  margin: 14px 0;
}

.chat-row.left {
  justify-content: flex-start;
}

.chat-row.right {
  justify-content: flex-end;
}

.bubble-wrap {
  max-width: 85%;

}

}

.bubble {
  padding: 13px 16px;

  white-space: pre-wrap;
}

.progress {
  color: #5279d8;

.status {

}

@media (max-width: 550px) {
  body {
    padding: 12px;
  }

  .panel {
    padding: 15px;
  }

  h1 {
    font-size: 24px;

  .settings,
  .editor-grid {
    grid-template-columns: 1fr;
  }

  .bubble {
    font-size: 16px;
  }

    min-width: 100px;
  }

</style>
</head>

<body>

<div class="container">

  <h1>💬 영어 말풍선 대화 연습</h1>

  <p class="description">
    영어 문장을 듣고 따라 말하며 대화를 연습해 보세요.
    영어 문장과 한글 뜻을 직접 입력할 수 있습니다.
  </p>


  <!-- 대화 설정 -->
  <section class="panel">

    <h2>① 대화 설정</h2>

    <div class="settings">

      <div>
        <label for="chatCount">대화 개수</label>
        <input
          type="number"
          id="chatCount"
          min="1"
          max="50"
          value="12">
      </div>

      <div>
        <label for="voiceType">영어 발음</label>
        <select id="voiceType">
          <option value="en-US">미국식 영어</option>
          <option value="en-GB">영국식 영어</option>
        </select>
      </div>

    </div>

    <div class="button-row">

      <button type="button" id="createInputs" class="primary">
        입력칸 만들기
      </button>

      <button type="button" id="loadExample">
        예시 대화 불러오기
      </button>

    </div>

    <p class="help">
      대화 개수를 정한 뒤 입력칸 만들기를 누르세요.
      예시 대화를 불러오면 연습용 문장 12개가 입력됩니다.
    </p>

    <div id="editors"></div>

    <div class="button-row">

      <button type="button" id="startPractice" class="primary">
        대화 연습 시작
      </button>

    </div>

  </section>


  <!-- 대화 연습 -->
  <section class="panel">

    <div style="display:flex;justify-content:space-between;
                align-items:center;gap:10px;margin-bottom:15px;">

      <h2 style="margin:0;">② 대화 연습</h2>

      <span class="progress" id="progress">
        준비 전
      </span>

    </div>

    <div id="chatArea">

      <p class="help">
        대화문을 입력한 뒤 대화 연습 시작을 눌러 주세요.
      </p>

    </div>

    <p class="status" id="status" aria-live="polite">
      영어 문장을 듣고 따라 말해 보세요.
    </p>

    <div class="button-row">

      <button type="button" id="replay">
        🔊 영어 다시 듣기
      </button>

      <button type="button" id="showMeaning">
        한글 뜻 보기
      </button>

    </div>

    <div class="button-row">

      <button type="button" id="repeat">
        ▶ 따라 말하기
      </button>

      <button type="button" id="next" class="primary">
        다음 대화 →
      </button>

    </div>

  </section>

</div>


<script>
/* =========================================
   영어 말풍선 대화 연습
   ========================================= */

const chatCount = document.getElementById("chatCount");
const voiceType = document.getElementById("voiceType");
const editors = document.getElementById("editors");
const chatArea = document.getElementById("chatArea");
const progress = document.getElementById("progress");
const statusText = document.getElementById("status");

let dialogues = [];
let currentIndex = 0;
let meaningVisible = false;
let availableVoices = [];


/* =========================================
   예시 대화
   ========================================= */

const exampleDialogues = [

  ["Hello! How are you?", "안녕! 어떻게 지내?"],

  ["I am fine, thank you.", "잘 지내, 고마워."],

  ["What do you want to do today?", "오늘 뭐 하고 싶어?"],

  ["I want to play outside.", "밖에서 놀고 싶어."],

  ["That sounds fun!", "재미있겠다!"],

  ["Can you play with me?", "나랑 같이 놀 수 있어?"],

  ["Of course!", "물론이지!"],

  ["Let's play catch.", "캐치볼 하자."],

  ["Great idea!", "좋은 생각이야!"],

  ["Are you ready?", "준비됐어?"],

  ["Yes, let's go!", "응, 가자!"],

  ["We are going to have fun!", "우리 정말 재미있게 놀 거야!"]

];


/* =========================================
   영어 음성 준비
   ========================================= */

function loadVoices() {

  if ("speechSynthesis" in window) {

    availableVoices = window.speechSynthesis.getVoices();

  }

}

if ("speechSynthesis" in window) {

  loadVoices();

  window.speechSynthesis.addEventListener(
    "voiceschanged",
    loadVoices
  );

}


/* =========================================
   영어 음성 재생
   ========================================= */

function speakEnglish(text) {

  if (!text) return;

  if (!("speechSynthesis" in window)) {

    statusText.textContent =
      "이 브라우저에서는 영어 음성 재생을 지원하지 않습니다.";

    return;

  }

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = voiceType.value;
  speech.rate = 0.82;
  speech.pitch = 1;

  const prefix = voiceType.value.toLowerCase();

  const matchingVoice = availableVoices.find(voice =>
    voice.lang.toLowerCase() === prefix
  ) || availableVoices.find(voice =>
    voice.lang.toLowerCase().startsWith(prefix)
  );

  if (matchingVoice) {

    speech.voice = matchingVoice;

  }

  window.speechSynthesis.speak(speech);

}


/* =========================================
   입력칸 생성
   ========================================= */

function createInputs(useExamples = false) {

  let count = Number(chatCount.value);

  if (!Number.isFinite(count)) {
    count = 12;
  }

  count = Math.max(1, Math.min(50, Math.floor(count)));

  chatCount.value = count;

  editors.replaceChildren();

  for (let i = 0; i < count; i++) {

    const example = useExamples
      ? exampleDialogues[i] || ["", ""]
      : ["", ""];

    const editor = document.createElement("div");

    editor.className = "editor";

    const title = document.createElement("div");

    title.className = "editor-title";
    title.textContent = "대화 " + (i + 1);

    const grid = document.createElement("div");

    grid.className = "editor-grid";

    // 영어 입력
    const englishField = document.createElement("div");

    englishField.className = "field";

    const englishLabel = document.createElement("label");

    englishLabel.textContent = "영어 문장";

    const englishInput = document.createElement("textarea");

    englishInput.className = "englishInput";
    englishInput.placeholder = "예: Hello! How are you?";
    englishInput.value = example[0];

    // 한글 입력
    const koreanField = document.createElement("div");

    koreanField.className = "field";

    const koreanLabel = document.createElement("label");

    koreanLabel.textContent = "한글 뜻";

    const koreanInput = document.createElement("textarea");

    koreanInput.className = "koreanInput";
    koreanInput.placeholder = "예: 안녕! 어떻게 지내?";
    koreanInput.value = example[1];

    englishField.append(englishLabel, englishInput);

    koreanField.append(koreanLabel, koreanInput);

    grid.append(englishField, koreanField);

    editor.append(title, grid);

    editors.appendChild(editor);

  }

}


/* =========================================
   대화 말풍선 표시
   ========================================= */

function createBubble(text, side, speaker, isCurrent = false) {

  const row = document.createElement("div");

  row.className = "chat-row " + side;

  if (isCurrent) {

    row.classList.add("current");

  }

  const wrap = document.createElement("div");

  wrap.className = "bubble-wrap";

  const speakerLabel = document.createElement("div");

  speakerLabel.className = "speaker";
  speakerLabel.textContent = speaker;

  const bubble = document.createElement("div");

  bubble.className = "bubble";
  bubble.textContent = text;

  wrap.append(speakerLabel, bubble);

  row.appendChild(wrap);

  chatArea.appendChild(row);

}


function renderChat() {

  chatArea.replaceChildren();

  if (dialogues.length === 0) {

    chatArea.textContent = "먼저 대화문을 입력해 주세요.";

    return;

  }

  // 이전 대화는 그대로 표시
  for (let i = 0; i <= currentIndex; i++) {

    const item = dialogues[i];

    createBubble(
      item.english,
      "left",
      "A · English",
      i === currentIndex
    );

    // 이전 대화의 뜻은 표시
    // 현재 대화의 뜻은 버튼을 눌러야 표시
    if (item.korean && (i < currentIndex || meaningVisible)) {

      createBubble(
        item.korean,
        "right",
        "한글 뜻",
        false
      );

    }

  }

  progress.textContent =
    (currentIndex + 1) + " / " + dialogues.length;

  document.getElementById("showMeaning").textContent =
    meaningVisible ? "한글 뜻 숨기기" : "한글 뜻 보기";

  document.getElementById("next").textContent =
    currentIndex === dialogues.length - 1
      ? "처음부터 다시 ↺"
      : "다음 대화 →";

  chatArea.scrollTop = chatArea.scrollHeight;

}


/* =========================================
   대화 연습 시작
   ========================================= */

function startPractice() {

  const rows = Array.from(
    editors.querySelectorAll(".editor")
  );

  dialogues = rows.map(row => ({

    english: row.querySelector(".englishInput").value.trim(),

    korean: row.querySelector(".koreanInput").value.trim()

  })).filter(item => item.english !== "");

  if (dialogues.length === 0) {

    statusText.textContent =
      "영어 문장을 한 개 이상 입력해 주세요.";

    return;

  }

  currentIndex = 0;

  meaningVisible = false;

  renderChat();

  statusText.textContent =
    "첫 번째 영어 문장을 듣고 따라 말해 보세요.";

  speakEnglish(dialogues[currentIndex].english);

}


/* =========================================
   버튼 이벤트
   ========================================= */

document.getElementById("createInputs").addEventListener(
  "click",
  () => createInputs(false)
);


document.getElementById("loadExample").addEventListener(
  "click",
  () => createInputs(true)
);


document.getElementById("startPractice").addEventListener(
  "click",
  startPractice
);


document.getElementById("replay").addEventListener(
  "click",
  () => {

    if (dialogues[currentIndex]) {

      speakEnglish(dialogues[currentIndex].english);

    }

  }
);


document.getElementById("showMeaning").addEventListener(
  "click",
  () => {

    if (!dialogues.length) return;

    meaningVisible = !meaningVisible;

    renderChat();

  }
);


document.getElementById("repeat").addEventListener(
  "click",
  () => {

    if (!dialogues[currentIndex]) return;

    statusText.textContent =
      "영어 음성을 듣고 같은 문장을 따라 말해 보세요.";

    speakEnglish(dialogues[currentIndex].english);

  }
);


document.getElementById("next").addEventListener(
  "click",
  () => {

    if (!dialogues.length) return;

    if (currentIndex < dialogues.length - 1) {

      currentIndex++;

    } else {

      currentIndex = 0;

    }

    meaningVisible = false;

    renderChat();

    statusText.textContent =
      "영어 문장을 듣고 따라 말해 보세요.";

    speakEnglish(dialogues[currentIndex].english);

  }
);


/* =========================================
   처음 실행
   ========================================= */

createInputs(true);

</script>

</body>
</html>
```
