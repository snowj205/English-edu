<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 말하기 연습</title>
<style>
  :root { --ink:#263238; --muted:#6b7780; --blue:#4c83f1; --pale:#f4f7ff; --line:#e2e8f0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:#ffffff; }
  .app { min-height:100vh; display:flex; flex-direction:column; max-width:1200px; margin:auto; padding:18px 24px 22px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; color:var(--muted); font-size:14px; }
  .progress { height:7px; background:#e8edf5; border-radius:99px; overflow:hidden; margin:14px 0 20px; }
  .progress > div { height:100%; width:0; background:var(--blue); transition:width .2s; }
  .main { flex:1; display:grid; grid-template-columns:56px minmax(0,1fr) 56px; gap:18px; align-items:center; }
  .arrow { border:0; background:transparent; color:#526170; font-size:42px; cursor:pointer; padding:8px 0; }
  .arrow:disabled { opacity:.2; cursor:default; }
  .card { background:white; border:1px solid var(--line); border-radius:24px; padding:clamp(24px,5vw,64px); box-shadow:0 8px 30px #24334b0b; text-align:center; }
  .prompt { margin:0 0 18px; font-size:clamp(25px,4vw,42px); font-weight:750; line-height:1.5; }
  .hint { color:var(--muted); font-size:16px; min-height:24px; }
  .feedback { min-height:54px; margin:12px 0 0; font-size:20px; font-weight:700; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; }
  .feedback.good { color:#16845b; } .feedback.try { color:#c17a13; } .feedback.error { color:#c13b4a; }
  .mascot-wrap { display:none; flex-direction:column; align-items:center; justify-content:center; margin:0 auto 8px; }
  .mascot-wrap.show { display:flex; }
  .mascot { width:clamp(105px,16vw,150px); height:clamp(105px,16vw,150px); object-fit:contain; }
  .mascot-wrap.happy .mascot { animation:bunnyHop .65s ease-in-out 2; }
  .mascot-wrap.try .mascot { animation:bearWobble .55s ease-in-out 2; }
  .mascot-caption { font-size:clamp(22px,3vw,30px); font-weight:900; letter-spacing:1px; transform-origin:center; animation:captionPop .75s ease-in-out 2; }
  .mascot-wrap.happy .mascot-caption { color:#16845b; }
  .mascot-wrap.try .mascot-caption { color:#c17a13; }
  @keyframes bunnyHop { 0%,100%{transform:translateY(0) rotate(0)} 35%{transform:translateY(-17px) rotate(-5deg)} 65%{transform:translateY(0) rotate(5deg)} }
  @keyframes bearWobble { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-9deg)} 75%{transform:rotate(9deg)} }
  @keyframes captionPop { 0%,100%{transform:scale(.82)} 50%{transform:scale(1.18)} }
  .bottom { display:flex; flex-direction:column; align-items:center; gap:10px; padding-top:12px; }
  .mic { width:76px; height:76px; border:0; border-radius:50%; background:var(--blue); color:white; display:grid; place-items:center; cursor:pointer; box-shadow:0 7px 18px #4c83f14a; transition:transform .15s,background .15s; }
  .mic svg { width:34px; height:34px; fill:currentColor; }
  .mic.listening { background:#e24c66; transform:scale(1.06); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 12px #e24c6624; } }
  .status { color:var(--muted); text-align:center; font-size:14px; min-height:21px; }
  .show-answer { border:0; background:transparent; color:#607080; text-decoration:underline; cursor:pointer; font-size:14px; }
  .answer { color:#536171; font-size:15px; min-height:20px; text-align:center; }
  @media(max-width:650px) {
    .app { padding:12px; } .main { grid-template-columns:32px minmax(0,1fr) 32px; gap:5px; }
    .arrow { font-size:32px; } .card { padding:24px 12px; border-radius:18px; }
    .mic { width:68px; height:68px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top"><span>영어 말하기 연습</span><span id="counter">1 / 25</span></div>
  <div class="progress"><div id="progressBar"></div></div>
  <main class="main">
    <button class="arrow" id="prev" aria-label="이전 문제">‹</button>
    <section class="card">
      <div class="mascot-wrap" id="mascotWrap" aria-live="polite">
        <img class="mascot" id="mascot" src="https://raw.githubusercontent.com/snowj205/english-speaking-test/main/perfect.png" alt="정답 응원 캐릭터">
        <div class="mascot-caption" id="mascotCaption"></div>
      </div>
      <div class="prompt" id="prompt">나는 사과를 좋아해요.</div>
      <div class="hint" id="meaning"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
    </section>
    <button class="arrow" id="next" aria-label="다음 문제">›</button>
  </main>
  <div class="bottom">
    <button class="mic" id="mic" aria-label="말하기 시작" title="말하기 시작">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.93V21h2v-3.07A7 7 0 0 0 19 11h-2Z"/></svg>
    </button>
    <div class="status" id="status">마이크 버튼을 누르고 영어로 말해 보세요.</div>
    <button class="show-answer" id="showAnswer">정답 확인</button>
    <div class="answer" id="answer"></div>
  </div>
</div>
<script>
/*
  문제를 바꾸려면 아래 questions 목록만 수정하세요.
  각 문제는 korean(화면에 보일 한국어)과 answer(정답 영어 문장 하나)로 구성됩니다.
  문제를 추가하거나 삭제해도 전체 문제 수와 진행 표시가 자동으로 바뀝니다.
*/
const questions = [
  { type: "meaning", korean: "만나다", answer: "meet" },
  { type: "blank", prompt: "five _____ past three", korean: "3시 5분", answer: "minute" },
  { type: "meaning", korean: "멜론", answer: "melon" },
  { type: "sentence", english: "Melons are juicy and sweet", korean: "멜론은 즙이 많고 달다.", answer: "Melons are juicy and sweet." },
  { type: "blank", prompt: "fresh _____", korean: "신선한 우유", answer: "milk" },
  { type: "meaning", korean: "미터", answer: "meter" },
  { type: "blank", prompt: "middle _____", korean: "중학교", answer: "school" },
  { type: "meaning", korean: "중앙, 가운데", answer: "middle" },
  { type: "sentence", english: "I bought a sacarf for my mom.", korean: "엄마를 위해 스카프를 샀다.", answer: "I bought a sacarf for my mom." },
  { type: "blank", prompt: "one _____ dollars", korean: "100만 달러", answer: "million" },
  { type: "meaning", korean: "우유", answer: "milk" },
  { type: "blank", prompt: "look in a _____", korean: "거울을 보다", answer: "mirror" },
  { type: "meaning", korean: "100만", answer: "million" },
  { type: "sentence", english: "milk is healthy food.", korean: "우유는 건강에 좋은 음식이다.", answer: "milk is healthy food." },
  { type: "blank", prompt: "I _____ you.", korean: "나는 네가 그리워.", answer: "miss" },
  { type: "meaning", korean: "모형, 모델", answer: "model" },
  { type: "blank", prompt: "pocket _____", korean: "용돈", answer: "money" },
  { type: "meaning", korean: "원숭이", answer: "monkey" },
  { type: "sentence", english: "Watch your mouth!", korean: "말조심 하세요!", answer: "Watch your mouth!" },
  { type: "blank", prompt: "this _____", korean: "이번 달", answer: "month" },
  { type: "meaning", korean: "달", answer: "moon" },
  { type: "blank", prompt: "good _____", korean: "아침 인사", answer: "morning" },
  { type: "meaning", korean: "입", answer: "mouth" },
  { type: "sentence", english: "Sixty million people live here", korean: "6천만명의 사람들이 여기에 산다.", answer: "Sixty million people live here." },
  { type: "blank", prompt: "_____ your mouth", korean: "입을 움직여 보세요", answer: "move" }
];

let index = 0;
let recognition = null;
let listening = false;
let finalTranscript = "";
const promptEl = document.getElementById("prompt");
const meaningEl = document.getElementById("meaning");
const feedbackEl = document.getElementById("feedback");
const statusEl = document.getElementById("status");
const answerEl = document.getElementById("answer");
const micEl = document.getElementById("mic");

function normalize(text) {
  return text.toLowerCase().replace(/[.,!?;:'"’]/g, "").replace(/\s+/g, " ").trim();
}
function renderQuestion() {
  stopListening();
  const q = questions[index];
  if (q.type === "sentence") {
    promptEl.textContent = q.english;
    meaningEl.textContent = q.korean;
  } else {
    promptEl.textContent = q.type === "blank" ? q.prompt : q.korean;
    meaningEl.textContent = q.type === "blank" ? `뜻: ${q.korean}` : "";
  }
  feedbackEl.textContent = "";
  feedbackEl.className = "feedback";
  hideMascot();
  answerEl.textContent = "";
  statusEl.textContent = "마이크 버튼을 누르고 영어로 말해 보세요.";
  document.getElementById("counter").textContent = `${index + 1} / ${questions.length}`;
  document.getElementById("progressBar").style.width = `${((index + 1) / questions.length) * 100}%`;
  document.getElementById("prev").disabled = index === 0;
  document.getElementById("next").disabled = index === questions.length - 1;
}
function stopListening() {
  if (recognition && listening) {
    try { recognition.stop(); } catch (e) {}
  }
  listening = false;
  micEl.classList.remove("listening");
  micEl.setAttribute("aria-label", "말하기 시작");
}
function startListening() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    statusEl.textContent = "이 브라우저는 음성 인식을 지원하지 않아요. 최신 Chrome에서 열어 주세요.";
    feedbackEl.textContent = "음성 인식을 사용할 수 없어요.";
    feedbackEl.className = "feedback error";
    return;
  }
  if (listening) { stopListening(); return; }
  finalTranscript = "";
  answerEl.textContent = "";
  feedbackEl.textContent = "";
  recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;
  recognition.continuous = false;
  recognition.onstart = () => {
    listening = true;
    micEl.classList.add("listening");
    micEl.setAttribute("aria-label", "말하기 중지");
    const q = questions[index];
    if (q.type === "blank") {
      statusEl.textContent = "빈칸에 들어갈 영어 단어를 말해 보세요.";
    } else if (q.type === "sentence") {
      statusEl.textContent = "영어 문장 전체를 읽어 보세요.";
    } else {
      statusEl.textContent = "한국어 뜻에 맞는 영어 단어를 말해 보세요.";
    }
  };
  recognition.onresult = (event) => {
    let transcript = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    finalTranscript = transcript.trim();
    statusEl.textContent = finalTranscript ? `인식한 문장: “${finalTranscript}”` : "듣고 있어요…";
  };
  recognition.onerror = (event) => {
    let message = "음성을 인식하지 못했어요. 다시 시도해 보세요.";
    if (event.error === "not-allowed" || event.error === "service-not-allowed") message = "마이크 권한이 차단됐어요. 주소창 왼쪽의 사이트 설정에서 마이크를 허용해 주세요.";
    else if (event.error === "no-speech") message = "말소리가 들리지 않았어요. 마이크 가까이에서 다시 말해 보세요.";
    else if (event.error === "network") message = "음성 인식 서비스 연결에 실패했어요. 인터넷 연결을 확인해 주세요.";
    statusEl.textContent = message;
  };
  recognition.onend = () => {
    listening = false;
    micEl.classList.remove("listening");
    micEl.setAttribute("aria-label", "말하기 시작");
    if (finalTranscript) checkAnswer(finalTranscript);
    else if (!statusEl.textContent.includes("권한") && !statusEl.textContent.includes("연결에 실패")) statusEl.textContent = "다시 말하려면 마이크를 눌러 주세요.";
  };
  try { recognition.start(); }
  catch (e) { statusEl.textContent = "마이크를 시작하지 못했어요. 잠시 후 다시 시도해 주세요."; }
}
function checkAnswer(spoken) {
  const said = normalize(spoken);
  const correct = normalize(questions[index].answer) === said;
  answerEl.textContent = `내가 말한 문장: ${spoken}`;
  if (correct) {
    showMascot(true);
    feedbackEl.textContent = "정답이에요! 정말 잘했어요! 🎉";
    feedbackEl.className = "feedback good";
    statusEl.textContent = "완벽해요! 다음 문제로 넘어가 볼까요?";
    playFeedbackAudio(true);
  } else {
    showMascot(false);
    feedbackEl.textContent = "다시 한 번 도전해 봐요 🙂";
    feedbackEl.className = "feedback try";
    statusEl.textContent = "인식한 문장과 정답이 달라요. 발음 인식 오류일 수도 있으니 다시 말해 보세요.";
    playFeedbackAudio(false);
  }
}
function hideMascot() {
  const wrap = document.getElementById("mascotWrap");
  wrap.className = "mascot-wrap";
  document.getElementById("mascotCaption").textContent = "";
  document.getElementById("mascot").src = "";
}
function showMascot(correct) {
  const wrap = document.getElementById("mascotWrap");
  wrap.className = `mascot-wrap show ${correct ? "happy" : "try"}`;
  const mascot = document.getElementById("mascot");
  mascot.alt = correct ? "정답 축하 캐릭터" : "다시 도전 응원 캐릭터";
  mascot.src = correct
    ? "https://raw.githubusercontent.com/snowj205/english-speaking-test/main/perfect.png"
    : "https://raw.githubusercontent.com/snowj205/english-speaking-test/main/tryagain.png";
  document.getElementById("mascotCaption").textContent = correct ? "PERFECT!  GOOD JOB!" : "TRY AGAIN!";
  if (correct) {
    clearTimeout(window.goodJobImageTimer);
    window.goodJobImageTimer = setTimeout(() => {
      if (wrap.classList.contains("happy")) mascot.src = "https://raw.githubusercontent.com/snowj205/english-speaking-test/main/goodjob.png";
    }, 1100);
  }
}
const soundBase = "https://raw.githubusercontent.com/snowj205/english-speaking-test/main/";
let currentFeedbackAudio = null;
function playFeedbackAudio(correct) {
  // 이전 효과음이 재생 중이면 멈추고, 저장소의 MP3 파일을 재생합니다.
  if (currentFeedbackAudio) {
    currentFeedbackAudio.pause();
    currentFeedbackAudio.currentTime = 0;
  }
  const files = correct ? ["perfect.mp3", "goodjob.mp3"] : ["tryagain.mp3"];
  let position = 0;
  const playNext = () => {
    if (position >= files.length) return;
    const audio = new Audio(soundBase + files[position]);
    currentFeedbackAudio = audio;
    position++;
    audio.onended = playNext;
    audio.onerror = () => {
      // 파일을 찾을 수 없거나 재생이 차단된 경우 상태 문구로 안내합니다.
      statusEl.textContent = "음향 파일을 재생할 수 없어요. 저장소의 MP3 파일 이름과 위치를 확인해 주세요.";
    };
    audio.play().catch(() => {
      statusEl.textContent = "음향 재생이 차단되었어요. 화면을 한 번 누른 뒤 다시 시도해 주세요.";
    });
  };
  playNext();
}
document.getElementById("prev").addEventListener("click", () => { if (index > 0) { playNavigationTone(); index--; renderQuestion(); } });
document.getElementById("next").addEventListener("click", () => { if (index < questions.length - 1) { playNavigationTone(); index++; renderQuestion(); } });
document.getElementById("showAnswer").addEventListener("click", () => {
  answerEl.textContent = `정답: ${questions[index].answer}`;
  playNavigationTone();
});
function playNavigationTone() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = "sine"; osc.frequency.setValueAtTime(520, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(740, ctx.currentTime + 0.09);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.07, ctx.currentTime + 0.015); gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.13);
    osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.14);
    setTimeout(() => ctx.close(), 250);
  } catch (e) {}
}
micEl.addEventListener("click", startListening);
renderQuestion();
</script>
</body>
</html>
