```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>나만의 영어 학습 공간</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f7fb;
  color: #243044;
  font-family: Arial, "Malgun Gothic", sans-serif;
}

.wrap {
  max-width: 1050px;
  margin: auto;
  padding: 28px 22px;
}

header {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 28px;
  color: #5279d8;
  font-weight: bold;
}

.hero {
  background: white;
  border: 1px solid #e8edf4;
  border-radius: 25px;
  padding: 32px 28px;
  margin-bottom: 30px;
}

.eyebrow {
  color: #5279d8;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 2px;
}

h1 {
  font-size: clamp(28px, 5vw, 42px);
  line-height: 1.35;
  margin: 12px 0;
}

p {
  color: #788397;
  line-height: 1.7;
}

.menu {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 190px;
  padding: 20px 8px;
  background: white;
  border: 1px solid #e8edf4;
  border-radius: 22px;
  text-decoration: none;
  color: #243044;
  text-align: center;
  box-shadow: 0 5px 18px #2430440d;
  transition: .2s;
  cursor: pointer;
}

.card:hover {
  background: #edf3ff;
  border-color: #b9caff;
  transform: translateY(-3px);
}

.icon {
  font-size: 36px;
  margin-bottom: 16px;
}

.title {
  font-size: clamp(14px, 2vw, 21px);
  font-weight: bold;
  word-break: keep-all;
}

.desc {
  font-size: 12px;
  color: #788397;
  margin-top: 10px;
  line-height: 1.6;
}

/* 학습 메뉴 화면 */
#vocaSection,
#storySection {
  display: none;
}

/* 메인 화면으로 돌아가기 */
.back-button {
  display: inline-block;
  margin-bottom: 22px;
  padding: 10px 16px;
  border: 1px solid #dce4f2;
  border-radius: 10px;
  background: white;
  color: #5279d8;
  font-weight: bold;
  cursor: pointer;
  font-size: 15px;
}

.back-button:hover {
  background: #edf3ff;
}

/* 학습 버튼 배치 */
.lesson-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

.lesson-button {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 75px;
  padding: 10px 4px;
  border: 1px solid #e0e7f2;
  border-radius: 15px;
  background: white;
  color: #243044;
  font-size: 20px;
  font-weight: bold;
  text-decoration: none;
  text-align: center;
  overflow-wrap: anywhere;
  cursor: pointer;
  transition: .2s;
  box-shadow: 0 4px 12px #24304408;
}

.lesson-button:hover {
  background: #edf3ff;
  border-color: #5279d8;
  transform: translateY(-2px);
}

@media (max-width: 520px) {
  .wrap {
    padding: 18px 12px;
  }

  .hero {
    padding: 24px 18px;
  }

  .menu {
    gap: 8px;
  }

  .card {
    min-height: 150px;
    padding: 14px 4px;
    border-radius: 16px;
  }

  .icon {
    font-size: 27px;
    margin-bottom: 12px;
  }

  .title {
    font-size: 14px;
  }

  .desc {
    font-size: 10px;
  }

  .lesson-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }

  .lesson-button {
    min-height: 60px;
    padding: 8px 3px;
    font-size: 16px;
  }
}
</style>
</head>

<body>
<div class="wrap">

  <header>
    <span>MY ENGLISH</span>
    <span>나만의 영어 학습 공간</span>
  </header>

  <!-- 메인 화면 -->
  <section id="homeSection">

    <section class="hero">
      <div class="eyebrow">MY LEARNING</div>

      <h1>오늘도 한 단계씩,<br>영어를 즐겁게 배워요!</h1>

      <p>원하는 학습 메뉴를 선택해 영어 공부를 시작하세요.</p>
    </section>

    <main class="menu">

      <!-- 초등영단어800 -->
      <a class="card"
         href="#vocabulary"
         onclick="openVocaMenu(); return false;">

        <span class="icon">📚</span>
        <span class="title">초등영단어800</span>
        <span class="desc">알파벳별 단어 학습</span>

      </a>

      <!-- 영어표현익힘 -->
      <a class="card"
         href="#"
         onclick="alert('영어표현익힘은 준비 중입니다.'); return false;">

        <span class="icon">💬</span>
        <span class="title">영어표현익힘</span>
        <span class="desc">유용한 영어 표현 익히기</span>

      </a>

      <!-- 스토리영어 -->
      <a class="card"
         href="#story"
         onclick="openStoryMenu(); return false;">

        <span class="icon">📖</span>
        <span class="title">스토리영어</span>
        <span class="desc">이야기로 배우는 영어</span>

      </a>

    </main>
  </section>


  <!-- 초등영단어800 메뉴 -->
  <section id="vocaSection">

    <button class="back-button" onclick="backToHome()">
      ← 메인 화면
    </button>

    <section class="hero">
      <div class="eyebrow">VOCABULARY</div>

      <h1>초등영단어800</h1>

      <p>알파벳과 번호를 선택해 학습을 시작하세요.</p>
    </section>

    <div class="lesson-grid" id="lessonGrid"></div>

  </section>


  <!-- 스토리영어 메뉴 -->
  <section id="storySection">

    <button class="back-button" onclick="backToHome()">
      ← 메인 화면
    </button>

    <section class="hero">
      <div class="eyebrow">STORY ENGLISH</div>

      <h1>스토리영어</h1>

      <p>학습할 단계를 선택하세요.</p>
    </section>

    <div class="lesson-grid" id="storyGrid"></div>

  </section>

</div>


<script>

/* ==========================================
   초등영단어800
   A1부터 Z4까지 104개 버튼 생성
   파일 위치: voca 폴더
   ========================================== */

const lessonGrid = document.getElementById("lessonGrid");

const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

letters.split("").forEach(letter => {

  for (let number = 1; number <= 4; number++) {

    const lessonName = letter + number;

    const link = document.createElement("a");

    link.className = "lesson-button";
    link.textContent = lessonName;

    // 기존 파일 연결 유지
    link.href = "./voca/" + lessonName + ".html";

    lessonGrid.appendChild(link);
  }

});


/* ==========================================
   스토리영어
   버튼 이름을 각각 직접 지정
   파일 위치: story 폴더

   이름 변경 방법:
   name 안의 글자만 원하는 이름으로 수정하세요.
   url은 실제 파일 이름이므로 그대로 두세요.
   ========================================== */

const storyGrid = document.getElementById("storyGrid");

const storyLinks = [

  // 1~2번
  { name: "첫 번째 버튼 이름", url: "./story/basic01.html" },
  { name: "두 번째 버튼 이름", url: "./story/basic01+.html" },

  // 3~4번
  { name: "세 번째 버튼 이름", url: "./story/basic02.html" },
  { name: "네 번째 버튼 이름", url: "./story/basic02+.html" },

  // 5~6번
  { name: "다섯 번째 버튼 이름", url: "./story/basic02_실전활용.html" },
  { name: "여섯 번째 버튼 이름", url: "./story/basic03+.html" },

  // 7~8번
  { name: "일곱 번째 버튼 이름", url: "./story/basic04.html" },
  { name: "여덟 번째 버튼 이름", url: "./story/basic04+.html" },

  // 9~10번
  { name: "아홉 번째 버튼 이름", url: "./story/basic05.html" },
  { name: "열 번째 버튼 이름", url: "./story/basic05+.html" },

  // 11~12번
  { name: "열한 번째 버튼 이름", url: "./story/basic06.html" },
  { name: "열두 번째 버튼 이름", url: "./story/basic06+.html" },

  // 13~14번
  { name: "열세 번째 버튼 이름", url: "./story/basic07.html" },
  { name: "열네 번째 버튼 이름", url: "./story/basic07+.html" },

  // 15~16번
  { name: "열다섯 번째 버튼 이름", url: "./story/basic08.html" },
  { name: "열여섯 번째 버튼 이름", url: "./story/basic08+.html" }

];

storyLinks.forEach(item => {

  const link = document.createElement("a");

  link.className = "lesson-button";

  // 화면에 표시할 이름
  link.textContent = item.name;

  // 기존 HTML 파일로 이동
  link.href = item.url;

  storyGrid.appendChild(link);

});


/* ==========================================
   화면 전환
   ========================================== */

// 초등영단어800 메뉴 열기
function openVocaMenu() {

  document.getElementById("homeSection").style.display = "none";
  document.getElementById("storySection").style.display = "none";
  document.getElementById("vocaSection").style.display = "block";

  window.scrollTo(0, 0);
}


// 스토리영어 메뉴 열기
function openStoryMenu() {

  document.getElementById("homeSection").style.display = "none";
  document.getElementById("vocaSection").style.display = "none";
  document.getElementById("storySection").style.display = "block";

  window.scrollTo(0, 0);
}


// 메인 화면으로 돌아가기
function backToHome() {

  document.getElementById("vocaSection").style.display = "none";
  document.getElementById("storySection").style.display = "none";
  document.getElementById("homeSection").style.display = "block";

  window.scrollTo(0, 0);
}

</script>

</body>
</html>
```
