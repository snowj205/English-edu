<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>나만의 영어 학습 공간</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f7fb;
  color: #243044;
  font-family: Arial, "Malgun Gothic", sans-serif;
}

.wrap {
  max-width: 1050px;
  margin: auto;
  padding: 28px 22px;
}

header {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 28px;
  color: #5279d8;
  font-weight: bold;
}

.hero {
  background: white;
  border: 1px solid #e8edf4;
  border-radius: 25px;
  padding: 32px 28px;
  margin-bottom: 30px;
}
/* 메인 배너 이미지 */
.hero.banner {
  padding: 0;
  overflow: hidden;
  border-radius: 25px;
  border: none;
  background: transparent;
}

.hero.banner img {
  display: block;
  width: 100%;
  height: auto;
}
.eyebrow {
  color: #5279d8;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 2px;
}

h1 {
  font-size: clamp(28px, 5vw, 42px);
  line-height: 1.35;
  margin: 12px 0;
}

p {
  color: #788397;
  line-height: 1.7;
}

.menu {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 190px;
  padding: 20px 8px;
  background: white;
  border: 1px solid #e8edf4;
  border-radius: 22px;
  text-decoration: none;
  color: #243044;
  text-align: center;
  box-shadow: 0 5px 18px #2430440d;
  transition: .2s;
  cursor: pointer;
}

.card:hover {
  background: #edf3ff;
  border-color: #b9caff;
  transform: translateY(-3px);
}

.icon {
  font-size: 36px;
  margin-bottom: 16px;
}

.title {
  font-size: clamp(14px, 2vw, 21px);
  font-weight: bold;
  word-break: keep-all;
}

.desc {
  font-size: 12px;
  color: #788397;
  margin-top: 10px;
  line-height: 1.6;
}

/* 학습 메뉴 화면 */

#vocaSection,
#storySection {
  display: none;
}

/* 메인 화면으로 돌아가기 */

.back-button {
  display: inline-block;
  margin-bottom: 22px;
  padding: 10px 16px;
  border: 1px solid #dce4f2;
  border-radius: 10px;
  background: white;
  color: #5279d8;
  font-weight: bold;
  cursor: pointer;
  font-size: 15px;
}

.back-button:hover {
  background: #edf3ff;
}

/* 학습 버튼 배치 */

.lesson-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

.lesson-button {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 75px;
  padding: 10px 4px;
  border: 1px solid #e0e7f2;
  border-radius: 15px;
  background: white;
  color: #243044;
  font-size: 20px;
  font-weight: bold;
  text-decoration: none;
  text-align: center;
  overflow-wrap: anywhere;
  cursor: pointer;
  transition: .2s;
  box-shadow: 0 4px 12px #24304408;
}

.lesson-button:hover {
  background: #edf3ff;
  border-color: #5279d8;
  transform: translateY(-2px);
}

@media (max-width: 520px) {
  .wrap {
    padding: 18px 12px;
  }

  .hero {
    padding: 24px 18px;
  }

  .menu {
    gap: 8px;
  }

  .card {
    min-height: 150px;
    padding: 14px 4px;
    border-radius: 16px;
  }

  .icon {
    font-size: 27px;
    margin-bottom: 12px;
  }

  .title {
    font-size: 14px;
  }

  .desc {
    font-size: 10px;
  }

  .lesson-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }

  .lesson-button {
    min-height: 60px;
    padding: 8px 3px;
    font-size: 16px;
  }
}
</style>
</head>

<section class="hero banner">

  </section>


  <!-- 초등영단어800 메뉴 -->

  <section id="vocaSection">
