<body>

<div class="wrap">

  <header>
    <div class="brand">ENGLISH · VOCA 800</div>
    <a class="home-link" href="./home.html">← 메인 화면</a>
  </header>

  <section class="hero">
    <div class="eyebrow">ELEMENTARY VOCABULARY</div>
    <h1>초등영단어 800</h1>
    <p>
      학습할 알파벳을 선택하세요.<br>
      알파벳마다 4개의 학습 단계가 준비되어 있습니다.
    </p>
  </section>

  <div class="section-head">
    <h2>알파벳 선택</h2>
    <span class="hint">A–Z · 총 26개</span>
  </div>

  <!-- A~Z 버튼 -->
  <main class="alphabet-grid" id="alphabetGrid"></main>

  <!-- 알파벳을 누르면 나타나는 학습 단계 -->
  <section class="lesson-panel" id="lessonPanel" aria-live="polite">

    <div class="panel-top">
      <div class="panel-title" id="panelTitle">A 학습 목록</div>
      <button class="back-button" id="backButton" type="button">
        알파벳 목록
      </button>
    </div>

    <div class="lesson-grid" id="lessonGrid"></div>

    <p class="footnote">
      원하는 번호를 선택하세요. 학습 파일은 각 단계별로 연결할 수 있습니다.
    </p>

  </section>

</div>

<script>
const alphabetGrid = document.getElementById('alphabetGrid');
const lessonPanel = document.getElementById('lessonPanel');
const lessonGrid = document.getElementById('lessonGrid');
const panelTitle = document.getElementById('panelTitle');
const backButton = document.getElementById('backButton');

const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

// A부터 Z까지 버튼 생성
alphabet.forEach(letter => {
  const button = document.createElement('button');

  button.type = 'button';
  button.className = 'letter-button';
  button.textContent = letter;

  button.addEventListener('click', () => {
    showLessons(letter, button);
  });

  alphabetGrid.appendChild(button);
});

// 알파벳을 누르면 해당 알파벳의 학습 버튼 4개 표시
function showLessons(letter, selectedButton) {

  document.querySelectorAll('.letter-button').forEach(button => {
    button.classList.remove('active');
  });

  selectedButton.classList.add('active');

  panelTitle.textContent = `${letter} 학습 목록`;

  lessonGrid.innerHTML = '';

  for (let i = 1; i <= 4; i++) {

    const link = document.createElement('a');

    link.className = 'lesson-button';
    link.textContent = `${letter}${i}`;

    // 나중에 각 학습 파일을 만들면 이 주소로 연결
    link.href = `./${letter}/${letter}${i}/index.html`;

    link.addEventListener('click', event => {
      event.preventDefault();

      alert(
        `${letter}${i} 학습 페이지는 아직 연결되지 않았습니다.\n\n` +
        `추후 연결할 파일 경로:\n${letter}/${letter}${i}/index.html`
      );
    });

    lessonGrid.appendChild(link);
  }

  lessonPanel.classList.add('show');

  lessonPanel.scrollIntoView({
    behavior: 'smooth',
    block: 'start'
  });
}

// 알파벳 목록으로 돌아가기
backButton.addEventListener('click', () => {

  lessonPanel.classList.remove('show');

  document.querySelectorAll('.letter-button').forEach(button => {
    button.classList.remove('active');
  });

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
});
</script>

</body>
</html>
